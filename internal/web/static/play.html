<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urth</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#15171c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Urth">
<!--analytics-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f12; --panel: #15171c; --panel-2: #1b1e25; --line: #262a33;
    --fg: #d6d3c8; --dim: #7c8090; --accent: #e0b04a; --ok: #7cc47c; --bad: #d95f5f; --mana: #5a8fd6; --stamina: #d9a24a;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); overflow: hidden; }
  body { display: flex; justify-content: center; }
  #app { width: 100%; max-width: 520px; height: 100dvh; display: flex; flex-direction: column; }
  button { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: .5em .8em; cursor: pointer; touch-action: manipulation; }
  button:active { background: #232731; }
  button:disabled { opacity: .3; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button.ghost { background: none; border-color: transparent; color: var(--dim); padding: .4em .5em; }
  .dim { color: var(--dim); }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 5px; background: #23262e; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ok); transition: width .25s; }
  .bar.foe > i { background: var(--bad); }
  .bar.mana > i { background: var(--mana); }
  .bar.stam > i { background: var(--stamina); }
  /* The server's color codes, in the main client's palette (index.html).
     Creatures are yellow, what can be taken green, fixed things dim, and a
     rolled item takes its tier's color, as in the text. */
  .c-d { color: #3a3d46 } .c-D { color: #7c8090 }
  .c-r { color: #b3453f } .c-R { color: #e8685f }
  .c-g { color: #4f9a55 } .c-G { color: #7cc47c }
  .c-y { color: #b28a2e } .c-Y { color: #e0b04a }
  .c-b { color: #3d64a8 } .c-B { color: #6f9be0 }
  .c-m { color: #9a4f9a } .c-M { color: #d17ad1 }
  .c-c { color: #3a9a9a } .c-C { color: #6fd0d0 }
  .c-w { color: #b8b5aa } .c-W { color: #f2efe4 }
  .mob { color: #e0b04a; } .item { color: #7cc47c; } .fixed { color: var(--dim); }
  .tier { font-size: .8em; }

  /* Login */
  #login { flex: 1; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) 16px 16px; min-height: 0; }
  #login h1 { font-size: 1.4em; color: var(--accent); margin: 8px 0 12px; letter-spacing: .12em; }
  #banner { display: none; margin: 0 0 10px; white-space: pre; overflow: hidden; font-family: var(--mono); line-height: 1.12;
    color: var(--accent); text-align: left; }
  #loginlog { flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; font: 13px/1.4 var(--mono);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  #loginform { display: flex; gap: 8px; margin-top: 10px; padding-bottom: env(safe-area-inset-bottom); }
  input.text { flex: 1; min-width: 0; font: inherit; padding: .6em .8em; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); }

  /* Game: a fixed screen. Header, map, pad, ticker, then one panel that
     scrolls on its own, then the tab bar. */
  #game { display: none; flex: 1; min-height: 0; flex-direction: column; }
  #top { padding: calc(8px + env(safe-area-inset-top)) 12px 6px; }
  #who { font-weight: 600; font-size: .9em; }
  #vit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 5px; }
  #vit .v { font-size: .7em; color: var(--dim); }
  #vit .v span { float: right; color: var(--fg); }

  #xprow { margin-top: 6px; }
  #xprow .v { font-size: .7em; color: var(--dim); }
  #xprow .v b { color: var(--fg); font-weight: 600; margin-right: 6px; }
  #xprow .v span { float: right; }
  .bar.xp { height: 4px; } .bar.xp > i { background: #b07ae0; }
  /* The battle view takes the map's place while a fight lasts: foes on
     top (tap one to target it), the combat feed filling the rest. */
  #battle { margin: 0 12px; height: clamp(220px, 40dvh, 360px); flex: none; flex-direction: column; padding: 8px;
    border-radius: 14px; border: 1px solid #4a2a2a; background: radial-gradient(circle at 50% 0%, #241618 0%, #140f10 75%); overflow: hidden; }
  #foes { flex: none; display: flex; flex-direction: column; gap: 5px; max-height: 48%; overflow-y: auto; }
  .foe { padding: 6px 9px; border-radius: 10px; background: #211618; border: 1px solid #3a2326; cursor: pointer; }
  .foe.target { border-color: var(--bad); background: #2a181a; cursor: default; }
  .foe .row { font-size: .9em; } .foe .hp { font-size: .8em; color: var(--dim); }
  .foe .bar { height: 7px; margin-top: 4px; }
  #casting { font-size: .82em; color: var(--mana); padding: 4px 2px 0; }
  #casting:empty { display: none; }
  #combatlog { font: 12px/1.45 var(--mono); color: #b9b6ab; margin-top: 6px; padding: 6px 8px; background: #0c0909;
    border-radius: 8px; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #combatlog div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #combatlog:empty { display: none; }
  /* The reward card sits in the screen's column above the tab bar, so it
     takes room from the panel rather than covering anything. Its header
     and gains stay put; its item list scrolls; it never grows past about
     a third of the screen. */
  #reward { margin: 0 12px 8px; border-radius: 14px; background: #1c1a12; border: 1px solid #5a4a1e;
    box-shadow: 0 -6px 24px #0008; animation: rise .25s ease-out; flex: none; display: flex; flex-direction: column;
    max-height: 34dvh; overflow: hidden; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  #reward .head { display: flex; align-items: flex-start; gap: 8px; padding: 9px 6px 0 12px; }
  #reward .title { flex: 1; min-width: 0; font-size: .8em; color: var(--dim); letter-spacing: .02em; }
  #reward .title b { color: var(--fg); font-weight: 600; }
  #reward .x { padding: 0 .55em; font-size: 1.05em; line-height: 1.4; }
  #reward .gains { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px 8px; }
  #reward .gain { font-weight: 700; font-size: 1em; padding: 2px 10px; border-radius: 999px; background: #2a2618; }
  #reward .gain.xp { color: #c9a0f0; } #reward .gain.coin { color: var(--accent); } #reward .gain.lvl { color: #111; background: var(--accent); }
  #reward .loot { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 6px; font-size: .92em; border-top: 1px solid #3a321a; }
  #reward .loot > div { padding: 5px 0; border-top: 1px solid #2a2618; }
  #reward .loot > div:first-child { border-top: 0; }
  #reward .foot { padding: 6px 12px 9px; display: flex; justify-content: flex-end; border-top: 1px solid #3a321a; }
  #reward.compact { cursor: pointer; }
  #reward.compact .gains { padding-top: 0; }
  #reward .more { color: var(--dim); font-size: .85em; align-self: center; }
  #stage { position: relative; margin: 0 12px; height: clamp(190px, 33dvh, 300px); flex: none; border-radius: 14px; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #1a1d24 0%, #111318 70%); border: 1px solid var(--line); touch-action: none; }
  #map { width: 100%; height: 100%; display: block; }
  #maptop { position: absolute; left: 10px; right: 48px; top: 7px; display: flex; align-items: center; gap: 6px; pointer-events: none; }
  #roomname { color: var(--accent); font-weight: 600; font-size: .92em; text-shadow: 0 1px 3px #000; }
  .tag { font-size: .68em; padding: 1px 6px; border-radius: 6px; background: #0009; color: var(--dim); }
  #mapbtns { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; gap: 5px; }
  #mapbtns button { width: 32px; height: 32px; padding: 0; background: #15171ccc; border-radius: 8px; font-size: .95em; }
  #legend { position: absolute; left: 8px; bottom: 6px; font-size: .66em; color: var(--dim); background: #0008; padding: 2px 6px; border-radius: 6px; }
  #pick { position: absolute; left: 6px; right: 6px; bottom: 6px; display: none; background: #15171ef2; border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 10px; font-size: .9em; }
  #pick .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  #pickname { font-weight: 600; }

  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 8px 12px 0; flex: none; }
  #pad button { padding: .38em 0; font-size: .88em; border-radius: 9px; }
  #pad button.door { border-color: var(--accent); }

  #ticker { margin: 8px 12px 0; font: 12px/1.45 var(--mono); color: var(--dim); height: 2.9em; overflow: hidden; flex: none; cursor: pointer; }
  #ticker div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ticker div:last-child { color: var(--fg); }

  #panel { flex: 1; min-height: 0; overflow-y: auto; margin-top: 8px; padding: 2px 12px 12px; border-top: 1px solid var(--line); overscroll-behavior: contain; }
  .sec { font-size: .68em; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 12px 0 2px; }
  #desc { font-size: .88em; color: #b9b6ab; margin-top: 10px; cursor: pointer; }
  #desc.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .list > div { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid #1f222a; }
  .list > div:first-child { border-top: 0; }
  .list .name { flex: 1; min-width: 0; }
  .list button { padding: .32em .75em; font-size: .88em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { padding: .4em .8em; font-size: .88em; border-radius: 999px; }

  /* While fighting, the actions take the direction pad's place. */
  #actions { grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 8px 12px 0; flex: none; max-height: 24dvh; overflow-y: auto; }
  #actions button { position: relative; overflow: hidden; padding: .5em .3em; font-size: .86em; line-height: 1.2; }
  #actions button .cd { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
  #actions button small { display: block; color: var(--dim); font-size: .78em; }

  #log { font: 12px/1.45 var(--mono); white-space: pre-wrap; margin-top: 8px; }

  #tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--panel);
    padding-bottom: env(safe-area-inset-bottom); flex: none; }
  #tabs button { border: 0; border-radius: 0; background: none; color: var(--dim); padding: .7em 0 .65em; font-size: .82em; position: relative; }
  #tabs button.on { color: var(--accent); }
  #tabs button.on::before { content: ""; position: absolute; left: 30%; right: 30%; top: 0; height: 2px; background: var(--accent); border-radius: 2px; }
  .list .badge { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: #111; font-size: .75em; font-weight: 600; }
  #tabs .badge { display: inline-block; min-width: 1.4em; margin-left: 3px; padding: 0 4px; border-radius: 999px; background: #2a2e38; color: var(--fg); font-size: .8em; }
  #tabs .alert::after { content: ""; position: absolute; top: 8px; right: calc(50% - 22px); width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }

  #sheet { position: fixed; inset: auto 0 0 0; display: none; justify-content: center; z-index: 5; }
  #sheet > div { width: 100%; max-width: 520px; background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px #0008; }
  #sheet .grip { width: 36px; height: 4px; border-radius: 2px; background: #3a3e48; margin: 0 auto 10px; }
  #sheet .acts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; max-height: 40dvh; overflow-y: auto; }
  #sheet .acts small { display: block; font-size: .78em; }
  #sheetsub { font-size: .85em; margin-top: 4px; }
  #sheetsub:empty { display: none; }
  .list > div.picked { background: #22261c; border-radius: 8px; }
  .tick { width: 1.3em; display: inline-block; color: var(--accent); font-weight: 700; }
  #bagbar:empty { display: none; }
  #bagbar { margin-top: 10px; }
  #bagbar .count { align-self: center; font-size: .85em; color: var(--dim); }
  @keyframes lowpulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .bar.low > i { background: var(--bad); animation: lowpulse 1s ease-in-out infinite; }
  button.flee-now { background: var(--bad); color: #111; font-weight: 700; animation: lowpulse 1.2s ease-in-out infinite; }
  .up { color: #7cc47c; font-weight: 700; } .down { color: #d97a6f; } .same { color: var(--dim); }
  .cmp { font-size: .78em; margin-left: 6px; white-space: nowrap; }
  #sheettext { font: 12.5px/1.45 var(--mono); white-space: pre-wrap; color: #b9b6ab; max-height: 45dvh; overflow-y: auto; margin-top: 8px; }
  #shade { position: fixed; inset: 0; background: #0008; display: none; z-index: 4; }
</style>
</head>
<body>
<div id="app">
  <div id="login">
    <h1 id="title">URTH</h1>
    <pre id="banner"></pre>
    <div id="loginlog">Tap Connect, then answer the prompts: your name, then your password.</div>
    <button type="button" class="primary" id="quick" style="display:none; margin-top:10px"></button>
    <form id="loginform">
      <input id="logininput" class="text" autocomplete="off" autocapitalize="off" placeholder="not connected">
      <button class="primary" id="loginbtn" type="submit">Connect</button>
    </form>
  </div>

  <div id="game">
    <div id="top">
      <div class="row"><span id="who" class="grow ellipsis"></span><span id="silver" class="dim" style="font-size:.85em"></span></div>
      <div id="vit">
        <div><div class="v">HP<span id="hp"></span></div><div class="bar" id="hpwrap"><i id="hpbar"></i></div></div>
        <div id="manawrap"><div class="v">MP<span id="mana"></span></div><div class="bar mana"><i id="manabar"></i></div></div>
        <div id="stamwrap"><div class="v">ST<span id="stam"></span></div><div class="bar stam"><i id="stambar"></i></div></div>
      </div>
      <div id="xprow"><div class="v"><b id="xplevel"></b><span id="xptext"></span></div><div class="bar xp"><i id="xpbar"></i></div></div>
    </div>

    <div id="stage">
      <canvas id="map"></canvas>
      <div id="maptop"><span id="roomname" class="ellipsis"></span><span id="roomtags"></span></div>
      <div id="mapbtns">
        <button type="button" id="zin" title="Zoom in">+</button>
        <button type="button" id="zout" title="Zoom out">−</button>
        <button type="button" id="center" title="Back to me">◎</button>
      </div>
      <div id="legend"></div>
      <div id="pick">
        <div class="row"><span id="pickname" class="grow ellipsis"></span><span id="pickinfo" class="dim"></span></div>
        <div class="acts" id="pickacts"></div>
      </div>
    </div>

    <div id="battle" style="display:none">
      <div id="foes"></div>
      <div id="casting"></div>
      <div id="combatlog"></div>
    </div>
    <div id="pad"></div>
    <div id="actions" style="display:none"></div>
    <div id="ticker" title="Open the log"></div>

    <div id="panel">
      <div data-pane="here">
        <div id="desc" class="clamp"></div>
        <div class="list" id="herelist"></div>
        <div class="chips" id="restrow"></div>
      </div>
      <div data-pane="bag" style="display:none"><div class="chips" id="bagbar"></div><div class="list" id="baglist"></div></div>
      <div data-pane="gear" style="display:none"><div class="list" id="gearlist"></div></div>
      <div data-pane="log" style="display:none">
        <div class="chips" id="talkmodes"></div>
        <form id="cmdform" class="row" style="margin-top:8px"><input id="cmd" class="text" autocomplete="off" autocapitalize="off" placeholder="type a command"><button type="submit">Send</button></form>
        <div id="log"></div>
      </div>
      <div data-pane="me" style="display:none"><div class="list" id="melist"></div></div>
    </div>

    <div id="reward" style="display:none"></div>
    <nav id="tabs">
      <button type="button" data-tab="here" class="on">Here</button>
      <button type="button" data-tab="bag">Bag<span class="badge" id="bagcount"></span></button>
      <button type="button" data-tab="gear">Gear</button>
      <button type="button" data-tab="log">Log</button>
      <button type="button" data-tab="me">Me</button>
    </nav>
  </div>
</div>
<div id="shade"></div>
<div id="sheet"><div>
  <div class="grip"></div>
  <div class="row"><strong id="sheetname" class="grow ellipsis"></strong><button type="button" class="ghost" id="sheetclose">Close</button></div>
  <div id="sheetsub"></div>
  <div id="sheettext"></div>
  <div class="acts" id="sheetacts"></div>
</div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ws = null, inGame = false, state = null, feed = [], logLines = [], sheetFor = null, sheetLines = [];

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function btn(label, onClick, cls) {
    var b = el('button', cls || '', label); b.type = 'button';
    b.addEventListener('click', function (ev) { ev.stopPropagation(); onClick(); }); return b;
  }
  function send(line) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(line); }
  // sendAll sends commands one at a time, a little apart, since the server
  // takes one command a tick per player and queues only so many.
  var outbox = [], outboxTimer = null;
  function sendAll(cmds) {
    outbox = outbox.concat(cmds);
    if (outboxTimer) return;
    (function next() {
      if (!outbox.length) { outboxTimer = null; return; }
      send(outbox.shift());
      outboxTimer = setTimeout(next, 150);
    })();
  }
  function remember(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  // A short buzz when health drops and a longer one on a level, if the
  // phone can and the player has not turned it off.
  var buzzOn = recall('urth.buzz') !== '0', lastHealth = null, lastLevel = null, restingToFull = false, lastPosition = null;
  function buzz(pattern) { if (buzzOn && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }
  function pct(a, b) { return (b > 0 ? Math.max(0, Math.min(100, 100 * a / b)) : 0) + '%'; }

  // ---- Login: the server's own prompts, answered in one input --------
  function loginAppend(text) {
    var log = $('loginlog'); log.textContent += text;
    if (log.textContent.length > 20000) log.textContent = log.textContent.slice(-20000);
    log.scrollTop = log.scrollHeight;
  }
  $('loginform').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!ws || ws.readyState !== WebSocket.OPEN) { connect(); return; }
    var input = $('logininput');
    send(input.value);
    loginAppend((input.type === 'password' ? '' : input.value) + '\n');
    input.value = '';
  });

  // The server's banner is wide ASCII art. It goes in its own block, never
  // wrapped, with the font sized so its widest line fits the screen.
  var bannerText = '';
  function showBanner(text) {
    // Drop blank edges and the margin every line shares.
    var lines = text.split('\n').map(function (l) { return l.replace(/\s+$/, ''); });
    while (lines.length && !lines[0]) lines.shift();
    while (lines.length && !lines[lines.length - 1]) lines.pop();
    var indent = lines.filter(function (l) { return l; }).reduce(function (n, l) { return Math.min(n, l.length - l.replace(/^ +/, '').length); }, 1e9);
    bannerText = lines.map(function (l) { return l.slice(Math.min(indent, l.length)); }).join('\n');
    var b = $('banner');
    b.textContent = bannerText;
    b.style.display = bannerText ? 'block' : 'none';
    $('title').style.display = bannerText ? 'none' : '';
    fitBanner();
  }
  function fitBanner() {
    var b = $('banner');
    if (!bannerText || !b.clientWidth) return;
    var cols = bannerText.split('\n').reduce(function (n, l) { return Math.max(n, l.length); }, 1);
    // A monospace character is about 0.6em wide.
    b.style.fontSize = Math.min(13, Math.max(4, b.clientWidth / (cols * 0.6))) + 'px';
  }
  window.addEventListener('resize', fitBanner);

  // A copyover sends a token first; tapping Reconnect resumes the session
  // with it, with no sign-in (D14). The page never reconnects unasked.
  // After an unexpected drop (the phone slept), the page resumes by itself
  // once it is visible again, with the resume token from the server, and
  // gets the same character back (D24). A quit forgets the token.
  var reconnectToken = null, expectRestart = false;
  var resumeToken = null, resumeTries = 0, resumePending = false, usedResume = false;
  try { resumeToken = localStorage.getItem('urth.resume'); } catch (e) {}
  function keepResume(t) {
    resumeToken = t;
    try { if (t) localStorage.setItem('urth.resume', t); else localStorage.removeItem('urth.resume'); } catch (e) {}
  }
  var RESUME_WAIT = [500, 2000, 5000, 10000];
  function scheduleResume() {
    if (!resumeToken || resumeTries >= RESUME_WAIT.length) { resumePending = false; return false; }
    resumePending = true;
    if (document.visibilityState === 'visible') setTimeout(function () { if (resumePending) connect(); }, RESUME_WAIT[resumeTries]);
    return true;
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && resumePending && (!ws || ws.readyState === WebSocket.CLOSED)) connect();
  });
  // "Sign in as <name>": the last character on this device. It connects
  // and answers the name prompt; the password is still asked for.
  var quickName = recall('urth.name'), sendNameOnPrompt = false;
  function showQuick() {
    var q = $('quick');
    q.style.display = quickName && !inGame && (!ws || ws.readyState !== WebSocket.OPEN) ? '' : 'none';
    q.textContent = 'Sign in as ' + quickName;
  }
  $('quick').addEventListener('click', function () { sendNameOnPrompt = true; $('quick').style.display = 'none'; connect(); });
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    resumePending = false;
    var token = reconnectToken || resumeToken, resuming = !!token, opened = false;
    usedResume = !reconnectToken && !!resumeToken;
    ws = new WebSocket(proto + location.host + '/ws' + (resuming ? '?token=' + encodeURIComponent(token) : ''));
    reconnectToken = null; expectRestart = false;
    if (!inGame) $('loginlog').textContent = resuming ? 'Resuming…\n' : '';
    if (!resuming) showBanner('');
    $('loginbtn').textContent = 'Send';
    $('logininput').placeholder = 'type here';
    ws.onopen = function () { opened = true; resumeTries = 0; if (!inGame) $('logininput').focus(); };
    ws.onclose = function (e) {
      if (!opened) resumeTries++;
      var unexpected = !expectRestart && !(e.code === 1000 || e.reason === 'idle');
      if (e.code === 1000) keepResume(null); // a quit, a kick, or a deny
      if (unexpected && scheduleResume()) {
        if (inGame) addText('[connection lost: reconnecting]', null);
        else $('loginlog').textContent = 'Reconnecting…\n';
        return; // the game stays on screen while it comes back
      }
      inGame = false; state = null; closeSheet();
      $('game').style.display = 'none'; $('login').style.display = 'flex';
      if (expectRestart) loginAppend('\nThe server is restarting. Tap ' + (reconnectToken ? 'Reconnect to carry on where you were.' : 'Connect when it is back.') + '\n');
      else loginAppend('\n[disconnected]\n');
      $('loginbtn').textContent = reconnectToken ? 'Reconnect' : 'Connect';
      showQuick();
      $('logininput').type = 'text'; $('logininput').placeholder = 'not connected';
    };
    ws.onmessage = function (e) { JSON.parse(e.data).forEach(handle); };
  }

  function handle(m) {
    switch (m.type) {
      case 'echo-off': $('logininput').type = 'password'; return;
      case 'echo-on': $('logininput').type = 'text'; return;
      case 'reconnect': reconnectToken = (m.data && m.data.token) || null; expectRestart = true; return;
      case 'session': keepResume(m.data && m.data.token); return;
      case 'commands': if (!inGame) { enterGame(); send('look'); } return; // in the game, as after a resume
      case 'state': state = m.data; render(); return;
      case 'expeditions': if (sheetFor === 'Expeditions') expeditionActs(m.data || []); return;
      case 'offers': if (sheetFor) offerActs(m.data || {}); return;
      case 'reward': showReward(m.data || {}); return;
      case 'room':
        if (!inGame) enterGame();
        showDescription(m.text);
        break;
      case 'prompt':
        if (sendNameOnPrompt && /^By what name/.test(m.text)) {
          sendNameOnPrompt = false; loginAppend(m.text + quickName + '\n'); send(quickName); return;
        }
        if (/^By what name/.test(m.text) && (inGame || usedResume)) {
          // The resume was not honoured (the character left meanwhile): sign in.
          usedResume = false; keepResume(null);
          inGame = false; state = null; closeSheet();
          $('game').style.display = 'none'; $('login').style.display = 'flex';
          $('loginlog').textContent = '';
          $('loginbtn').textContent = 'Send'; $('logininput').placeholder = 'type here';
        }
        if (!inGame) loginAppend(m.text);
        return;
    }
    if (!inGame && m.type === 'system' && /\n.*\n.*\n/.test(m.text) && !bannerText) { showBanner(m.text); return; }
    if (!inGame) { loginAppend(m.text); return; }
    addText(m.text, m.html, m.type === 'room');
  }

  function enterGame() {
    inGame = true;
    $('login').style.display = 'none'; $('game').style.display = 'flex';
    send('client state');
    setTimeout(drawMap, 0);
  }

  // The room message is name, description, exits, then what is here. The
  // description is the part worth keeping in view.
  function showDescription(text) {
    var lines = text.split('\n'), out = [];
    for (var i = 1; i < lines.length; i++) {
      if (/^\[Exits/.test(lines[i])) break;
      out.push(lines[i]);
    }
    var d = out.join('\n').trim();
    $('desc').textContent = d || (lines[0] || '');
  }
  $('desc').addEventListener('click', function () { $('desc').classList.toggle('clamp'); });

  // ---- Text: a two-line ticker of the latest, and the full log -------
  // Lines are kept as the server's HTML (escaped text in color spans, as
  // the main client shows them); a line with no text is dropped.
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function addText(text, html, logOnly) {
    var plain = text.split('\n'), marked = (html || esc(text)).split('\n'), lines = [];
    for (var i = 0; i < plain.length; i++) if (plain[i].trim() !== '') lines.push(marked[i] !== undefined ? marked[i] : esc(plain[i]));
    if (!lines.length) return;
    lines.forEach(function (l) { if (!logOnly) feed.push(l); logLines.push(l); });
    if (wasFighting && !logOnly) {
      combatLines = combatLines.concat(lines).slice(-30);
      var cl = $('combatlog'); cl.textContent = '';
      combatLines.forEach(function (l) { var d = el('div'); d.innerHTML = l; cl.appendChild(d); });
    }
    feed = feed.slice(-2); logLines = logLines.slice(-300);
    var f = $('ticker'); f.textContent = '';
    feed.forEach(function (l) { var d = el('div'); d.innerHTML = l; f.appendChild(d); });
    $('log').innerHTML = logLines.join('\n');
    if (currentTab === 'log') $('panel').scrollTop = $('panel').scrollHeight;
    if (sheetFor) { sheetLines = sheetLines.concat(lines).slice(-200); $('sheettext').innerHTML = sheetLines.join('\n'); }
  }

  // ---- Rewards: what kills, quests, and expeditions paid --------------
  // Rewards that arrive while the card shows are added to it, so a fight
  // with several foes ends in one card naming them all. While a fight is
  // still on, the card stays one line; it opens when the fight ends or on
  // a tap. It closes on its ✕, or by itself: 6 seconds without loot, 15
  // with, the clock restarting whenever it is touched.
  var shown = null, rewardTimer = null, rewardOpen = false;
  function showReward(r) {
    if (!shown) shown = { kills: [], titles: [], xp: 0, silver: 0, questPoints: 0, items: [], level: 0 };
    shown.kills = shown.kills.concat(r.kills || []);
    if (r.title && shown.titles.indexOf(r.title) < 0) shown.titles.push(r.title);
    shown.xp += r.xp || 0; shown.silver += r.silver || 0; shown.questPoints += r.questPoints || 0;
    shown.items = shown.items.concat(r.items || []);
    shown.level = Math.max(shown.level, r.level || 0);
    drawReward();
    armReward();
  }
  function armReward() {
    clearTimeout(rewardTimer);
    if (shown) rewardTimer = setTimeout(hideReward, shown.items.length || shown.level ? 15000 : 6000);
  }
  function hideReward() { clearTimeout(rewardTimer); shown = null; rewardOpen = false; $('reward').style.display = 'none'; }
  // "Defeated a hound of Annwn ×2, Gwyn ap Nudd"
  function killsText(kills) {
    var count = {}, order = [];
    kills.forEach(function (k) { if (!count[k]) { count[k] = 0; order.push(k); } count[k]++; });
    return order.map(function (k) { return count[k] > 1 ? k + ' ×' + count[k] : k; }).join(', ');
  }
  function drawReward() {
    var r = shown, box = $('reward'); box.textContent = '';
    if (!r) return;
    var fighting = state && state.enemies.length > 0;
    var compact = fighting && !rewardOpen;
    box.className = compact ? 'compact' : '';
    var head = el('div', 'head'), title = el('div', 'title');
    if (r.kills.length) {
      title.appendChild(document.createTextNode(r.kills.length > 1 ? 'Defeated ' + r.kills.length + ' foes: ' : 'Defeated '));
      title.appendChild(el('b', '', killsText(r.kills)));
    }
    r.titles.forEach(function (t) {
      if (title.childNodes.length) title.appendChild(document.createTextNode(' · '));
      title.appendChild(el('b', '', t));
    });
    if (!title.childNodes.length) title.textContent = 'Found';
    head.appendChild(title);
    head.appendChild(btn('✕', hideReward, 'ghost x'));
    box.appendChild(head);
    var gains = el('div', 'gains');
    if (r.level) gains.appendChild(el('span', 'gain lvl', 'Level ' + r.level + '!'));
    if (r.xp) gains.appendChild(el('span', 'gain xp', '+' + r.xp + ' XP'));
    if (r.silver) gains.appendChild(el('span', 'gain coin', '+' + coins(r.silver)));
    if (r.questPoints) gains.appendChild(el('span', 'gain coin', '+' + r.questPoints + ' QP'));
    if (compact && r.items.length) gains.appendChild(el('span', 'more', r.items.length + ' item' + (r.items.length > 1 ? 's' : '') + ' ▸'));
    box.appendChild(gains);
    if (!compact && r.items.length) {
      var loot = el('div', 'loot');
      r.items.forEach(function (it) {
        var d = el('div', 'row'), name = el('span', 'grow ' + (it.color ? 'c-' + it.color : ''), it.name);
        if (it.rarity) { name.appendChild(document.createTextNode(' ')); name.appendChild(el('span', 'tier', '(' + it.rarity + ')')); }
        var c = state ? compare(it, state) : null, mark = compareMark(c);
        if (mark) name.appendChild(mark);
        d.appendChild(name);
        if (c && c.dir === 'up' && it.ref) d.appendChild(btn('Wear', function () { send('wear ' + it.ref); }, 'primary'));
        loot.appendChild(d);
      });
      box.appendChild(loot);
      var foot = el('div', 'foot');
      foot.appendChild(btn('Open bag', function () { hideReward(); showTab('bag'); }));
      box.appendChild(foot);
    }
    box.style.display = 'flex';
  }
  // A tap on the one-line card opens it; any touch keeps the card up.
  $('reward').addEventListener('click', function () {
    if ($('reward').className === 'compact') { rewardOpen = true; drawReward(); }
    armReward();
  });
  $('reward').addEventListener('scroll', armReward, true);
  $('reward').addEventListener('pointerdown', armReward);

  // ---- Rendering from the state snapshot -----------------------------
  var lastRoom = 0;
  function render() {
    var s = state;
    if (lastHealth !== null && s.health < lastHealth) buzz(30);
    // Low health: the bar pulses, the phone buzzes once on crossing 30%.
    var low = s.healthMax > 0 && s.health / s.healthMax < 0.3;
    if (low && lastHealth !== null && lastHealth / s.healthMax >= 0.3) buzz([200, 80, 200]);
    $('hpwrap').classList.toggle('low', low);
    // Rest until full: wake and stand when every bar is full, give up if
    // a fight starts or the player got up.
    if (restingToFull) {
      if (s.enemies.length || s.position === 'standing' && lastPosition && lastPosition !== 'standing') restingToFull = false;
      else if (s.health >= s.healthMax && s.mana >= s.manaMax && s.stamina >= s.staminaMax) { restingToFull = false; send('stand'); }
    }
    lastPosition = s.position;
    if (lastLevel !== null && s.level > lastLevel) buzz([60, 60, 120]);
    lastHealth = s.health; lastLevel = s.level;
    if (s.name && recall('urth.name') !== s.name) remember('urth.name', s.name);
    $('who').textContent = s.name;
    $('xplevel').textContent = 'Level ' + s.level;
    if (s.nextXp > s.levelXp) {
      $('xpbar').style.width = pct(s.xp - s.levelXp, s.nextXp - s.levelXp);
      $('xptext').textContent = s.tnl + ' xp to ' + (s.level + 1);
    } else { $('xpbar').style.width = '100%'; $('xptext').textContent = 'top level'; }
    $('silver').textContent = coins(s.silver);
    $('hpbar').style.width = pct(s.health, s.healthMax); $('hp').textContent = s.health + '/' + s.healthMax;
    $('manawrap').style.visibility = s.manaMax > 0 ? '' : 'hidden';
    $('manabar').style.width = pct(s.mana, s.manaMax); $('mana').textContent = s.mana + '/' + s.manaMax;
    $('stamwrap').style.visibility = s.staminaMax > 0 ? '' : 'hidden';
    $('stambar').style.width = pct(s.stamina, s.staminaMax); $('stam').textContent = s.stamina + '/' + s.staminaMax;
    var bagN = s.inventory.reduce(function (n, it) { return n + (it.count || 1); }, 0);
    $('bagcount').textContent = bagN ? String(bagN) : '';
    $('bagcount').style.display = bagN ? '' : 'none';

    $('roomname').textContent = s.room.name;
    var tags = $('roomtags'); tags.textContent = '';
    if (s.room.safe) tags.appendChild(el('span', 'tag', 'safe'));
    if (s.room.vnum !== lastRoom) { lastRoom = s.room.vnum; pan = { x: 0, y: 0 }; picked = 0; showPick(); }
    setMap(s.map);
    renderPad(s);

    renderFight(s);
    renderHere(s);
    renderBag(s);
    renderGear(s);
    renderMe(s);
    if (sheetRefresh) sheetRefresh(s);
  }

  // The direction pad, always all six directions and look, laid out as a
  // compass with up and down at the top corners. A direction is live when
  // the room has that exit; a closed door is opened on the way, a locked
  // one leaves its button disabled (the door's row in Here unlocks it).
  var PAD = ['up', 'north', 'down', 'west', 'look', 'east', '', 'south', ''];
  var LABEL = { up: '▲ Up', down: '▼ Down', north: 'North', south: 'South', east: 'East', west: 'West', look: 'Look' };
  function renderPad(s) {
    var pad = $('pad'), cur = here(), doors = (cur && cur.doors) || {};
    pad.textContent = '';
    PAD.forEach(function (d) {
      if (!d) { pad.appendChild(el('span')); return; }
      if (d === 'look') { pad.appendChild(btn(LABEL[d], function () { openSheet(s.room.name, 'look', []); })); return; }
      var exists = s.room.exits.indexOf(d) >= 0 || !!(cur && cur.exits[d]);
      var b = btn(LABEL[d], function () {
        if (doors[d] === 'closed') send('open ' + d);
        send(d);
      }, doors[d] === 'closed' ? 'door' : '');
      b.disabled = !exists || doors[d] === 'locked';
      if (doors[d]) b.title = 'door ' + doors[d];
      pad.appendChild(b);
    });
  }

  function coins(silver) {
    if (!silver) return 'no coins';
    var g = Math.floor(silver / 100), sv = silver % 100;
    return (g ? g + 'g ' : '') + (sv ? sv + 's' : '');
  }

  var wasFighting = false, combatLines = [];
  // A fight takes over the map and the pad: the battle view where the map
  // was, the actions where the pad was. The ticker steps aside for the
  // feed. They come back when the fight ends.
  function renderFight(s) {
    var fighting = s.enemies.length > 0 || !!s.casting;
    if (fighting !== wasFighting) {
      $('stage').style.display = fighting ? 'none' : '';
      $('pad').style.display = fighting ? 'none' : '';
      $('ticker').style.display = fighting ? 'none' : '';
      $('battle').style.display = fighting ? 'flex' : 'none';
      $('actions').style.display = fighting ? 'grid' : 'none';
      if (fighting) { combatLines = []; $('combatlog').textContent = ''; }
      else setTimeout(drawMap, 0); // the canvas was hidden; size it again
      if (shown) { rewardOpen = false; drawReward(); } // one line in a fight, open after
    }
    wasFighting = fighting;
    if (!fighting) return;
    var foes = $('foes'); foes.textContent = '';
    s.enemies.forEach(function (e) {
      var isTarget = s.target && s.target.ref === e.ref && s.target.name === e.name;
      var d = el('div', 'foe' + (isTarget ? ' target' : ''));
      var top = el('div', 'row');
      top.appendChild(el('span', 'grow ellipsis', (isTarget ? '▶ ' : '') + e.name));
      top.appendChild(el('span', 'hp', Math.round(100 * e.health / Math.max(e.healthMax, 1)) + '%'));
      d.appendChild(top);
      var bar = el('div', 'bar foe'); var i = el('i'); i.style.width = pct(e.health, e.healthMax); bar.appendChild(i);
      d.appendChild(bar);
      if (!isTarget) d.addEventListener('click', function () { send('kill ' + e.ref); });
      foes.appendChild(d);
    });
    $('casting').textContent = s.casting ? 'Casting ' + s.casting.spell + '… ' + s.casting.rounds + ' round' + (s.casting.rounds === 1 ? '' : 's') : '';
    var acts = $('actions'); acts.textContent = '';
    s.skills.concat(s.spells).forEach(function (a) {
      var b = btn('', function () { send(a.command + (a.target === 'single' && s.target ? ' ' + s.target.ref : '')); });
      b.appendChild(document.createTextNode(a.name));
      var short = a.mana > s.mana || a.stamina > s.stamina || !!a.locked;
      b.appendChild(el('small', '', a.locked ? 'needs ' + a.locked : a.cooldown > 0 ? a.cooldown + ' rnd' : a.mana ? a.mana + ' mana' : a.stamina ? a.stamina + ' st' : 'ready'));
      if (short) b.disabled = true;
      if (a.cooldown > 0) { b.disabled = true; var cd = el('i', 'cd'); cd.style.width = Math.min(100, a.cooldown * 10) + '%'; b.appendChild(cd); }
      acts.appendChild(b);
    });
    var lowNow = s.healthMax > 0 && s.health / s.healthMax < 0.3;
    acts.appendChild(btn(lowNow ? 'Flee!' : 'Flee', function () { send('flee'); }, lowNow ? 'flee-now' : 'danger'));
  }


  // A row: a name, at most one main action, and "⋯" for the rest in a
  // sheet that also shows the look.
  function row(list, nameEl, main, more) {
    var d = el('div'); d.appendChild(nameEl);
    if (main) d.appendChild(btn(main[0], function () { if (typeof main[1] === 'function') main[1](); else send(main[1]); }, main[2] || 'primary'));
    if (more) d.appendChild(btn('⋯', more, 'ghost'));
    list.appendChild(d);
  }
  function section(list, title) { list.appendChild(el('div', 'sec', title)); }

  function renderHere(s) {
    var list = $('herelist'); list.textContent = '';
    if (s.room.mobs.length) {
      section(list, 'Creatures');
      s.room.mobs.forEach(function (m) {
        // A creature that serves players gets its service as the main
        // button; fighting it moves to the sheet.
        var svc = serviceAction(m);
        var fight = s.room.safe ? null : ['Fight', 'kill ' + m.ref];
        row(list, el('span', 'name ellipsis mob', m.name), svc || fight,
          function () { openSheet(m.name, 'look ' + m.ref, [['Consider', 'consider ' + m.ref]].concat(fight ? [fight] : [])); });
      });
    }
    if (s.room.players.length) {
      section(list, 'Players');
      s.room.players.forEach(function (n) {
        row(list, el('span', 'name ellipsis', n), null, function () {
          openSheet(n, 'look ' + n.toLowerCase(), [['Follow', 'follow ' + n], ['Invite to group', 'group ' + n],
            ['Tell…', function () { closeSheet(); talkTo('tell ' + n); }]]);
        });
      });
    }
    if (s.room.items.length) {
      section(list, 'Items');
      s.room.items.forEach(function (it) {
        var main = /corpse/.test(it.name) ? ['Loot', 'get all ' + it.ref] : it.fixed ? null : ['Take', 'get ' + it.ref, ''];
        var cls = it.color ? 'c-' + it.color : it.fixed ? 'fixed' : 'item';
        var label = el('span', 'name ellipsis ' + cls, (it.count > 1 ? '(' + it.count + ') ' : '') + it.name);
        if (it.rarity) { // as the room text has it: "a club (uncommon)", the tag in the tier's color
          label.title = it.rarity;
          label.appendChild(document.createTextNode(' '));
          label.appendChild(el('span', 'tier', '(' + it.rarity + ')'));
        }
        row(list, label, main,
          function () { openSheet(it.name, 'look ' + it.ref, it.fixed ? [] : [['Take', 'get ' + it.ref]]); });
      });
    }
    doorRows(list);
    var rest = $('restrow'); rest.textContent = '';
    if (s.enemies.length) return;
    var full = s.health >= s.healthMax && s.mana >= s.manaMax && s.stamina >= s.staminaMax;
    if (restingToFull) {
      rest.appendChild(btn('Resting until full… stop', function () { restingToFull = false; send('stand'); }, 'primary'));
    } else if (s.position === 'standing') {
      if (!full) rest.appendChild(btn('Rest until full', function () { restingToFull = true; send('sleep'); }, 'primary'));
      rest.appendChild(btn('Rest', function () { send('rest'); }));
      rest.appendChild(btn('Sleep', function () { send('sleep'); }));
    } else {
      rest.appendChild(btn('Stand up', function () { send('stand'); }, 'primary'));
    }
    rest.appendChild(btn('Scan', function () { openSheet('Nearby', 'scan', []); }));
    rest.appendChild(btn('Recall', function () { send('recall'); }));
  }

  function serviceAction(m) {
    var svc = m.services || [];
    if (svc.indexOf('shop') >= 0) return ['Shop', function () { openSheet(m.name, 'list', []); }];
    if (svc.indexOf('trainer') >= 0) return ['Train', function () { openSheet(m.name, 'practice', []); }];
    if (svc.indexOf('quest') >= 0) return ['Quest', function () { openSheet(m.name, 'quest info', [['Request a quest', 'quest request'], ['Complete it', 'quest complete']]); }];
    if (svc.indexOf('vendor') >= 0) return ['Wares', function () { openSheet(m.name, 'quest list', []); }];
    return null;
  }

  // What a merchant, trainer, or vendor offers, as one button each; the
  // sheet stays open so the trade's reply shows under the list.
  function offerActs(d) {
    var box = $('sheetacts'); box.textContent = '';
    (d.items || []).forEach(function (o) {
      var b = btn('', function () {
        send(o.command);
        // A feat pick changes what is available: list them again.
        if (d.from === 'feats') setTimeout(function () { if (sheetFor === 'Feats') openSheet('Feats', 'feat', []); }, 500);
      });
      b.appendChild(document.createTextNode(o.name));
      var meta = [o.price, o.note].filter(Boolean).join(' · ');
      if (meta) b.appendChild(el('small', 'dim', meta));
      if (o.about) b.appendChild(el('small', 'dim', o.about));
      b.style.textAlign = 'left';
      b.disabled = !!o.disabled;
      box.appendChild(b);
    });
  }

  // The Me tab: the character, its abilities, and settings, each a sheet.
  function renderMe(s) {
    var list = $('melist'); list.textContent = '';
    var rows = [
      ['Stats', function () { openSheet('Character', 'stats', []); }],
      ['Train stats', trainSheet, s.statPoints],
      ['Feats', function () { openSheet('Feats', 'feat', []); }, s.featPoints],
      ['Abilities', abilitiesSheet],
      ['Expeditions', function () { openSheet('Expeditions', 'expedition', []); }],

  // ---- Map ------------------------------------------------------------
  // The area around the player, drawn from the state's map: rooms seen
  // and unseen, doors, who is within scanning distance and how dangerous,
  // services, temples. Tap a room to walk there, your own room to look.
  // Drag to pan.

  var mapData = null, rooms = {}, cell = 44, pan = { x: 0, y: 0 }, picked = 0;

    $('pickinfo').textContent = describe(r);
    var acts = $('pickacts'); acts.textContent = '';
    if (r.vnum === state.room.vnum) {
      acts.appendChild(btn('Look', function () { openSheet(state.room.name, 'look', []); }));
      acts.appendChild(btn('Scan', function () { openSheet('Nearby', 'scan', []); }));
    } else {
      var lock = lockedFirst(r.vnum);
      if (lock) {
        $('pickinfo').textContent = 'the door ' + lock + ' is locked';
        doorActions(lock, 'locked').forEach(function (a) { acts.appendChild(btn(a[0], function () { send(a[1]); picked = 0; showPick(); drawMap(); }, 'primary')); });
      } else {
        $('pickinfo').textContent = 'no known way there' + (describe(r) ? ' · ' + describe(r) : '');
      }
    }
    acts.appendChild(btn('Close', function () { picked = 0; showPick(); drawMap(); }));
  }
  // Tapping the map is how you move, as clicking is on the browser
  // client's map: any room with a known way walks there at once, opening
  // closed doors on the way. Your own room offers Look and Scan.
  function tap(px, py) {
    var r = roomAtPoint(px, py);
    if (!r) { picked = 0; showPick(); drawMap(); return; }
    if (r.vnum !== state.room.vnum) {
      var steps = pathTo(r.vnum);
      if (steps) { picked = 0; showPick(); walk(steps); return; }
    }
    picked = r.vnum; showPick(); drawMap();
  }
  // lockedFirst is the direction of a locked door in this room that the
  // way to target starts through, if the only way there is past it.
  function lockedFirst(target) {
    var cur = here();
    if (!cur || !cur.doors) return '';
    var dirs = Object.keys(cur.doors).filter(function (d) { return cur.doors[d] === 'locked'; });
    for (var i = 0; i < dirs.length; i++) {
      var next = cur.exits[dirs[i]];
      if (next === target || (rooms[next] && pathFrom(next, target))) return dirs[i];
    }
    return '';
  }
  function pathFrom(start, target) {
    var seen = {}, queue = [start]; seen[start] = true;
    while (queue.length) {
      var v = queue.shift(); if (v === target) return true;
      var r = rooms[v]; if (!r) continue;
      Object.keys(r.exits).forEach(function (dir) {
        var to = r.exits[dir];
        if (seen[to] || !rooms[to] || (r.doors && r.doors[dir] === 'locked')) return;
        seen[to] = true; queue.push(to);
      });
    }
    return false;
  }
  // One finger drags (or taps); two fingers pinch to zoom.
  var drag = null, fingers = {}, pinch = null;
  function fingerList() { return Object.keys(fingers).map(function (k) { return fingers[k]; }); }
  function spread(f) { return Math.hypot(f[0].x - f[1].x, f[0].y - f[1].y) || 1; }
  canvas.addEventListener('pointerdown', function (ev) {
    fingers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    canvas.setPointerCapture && canvas.setPointerCapture(ev.pointerId);
    var f = fingerList();
    if (f.length === 2) { pinch = { d: spread(f), cell: cell }; drag = null; return; }
    drag = { x: ev.clientX, y: ev.clientY, px: pan.x, py: pan.y, moved: false };
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (fingers[ev.pointerId]) fingers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    if (pinch) {
      var f = fingerList();
      if (f.length === 2) zoom(pinch.cell * spread(f) / pinch.d / cell);
      return;
    }
    if (!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
    if (drag.moved) { pan.x = drag.px + dx; pan.y = drag.py + dy; drawMap(); }
  });
  function lift(ev) {
    delete fingers[ev.pointerId];
    if (pinch) { if (!fingerList().length) pinch = null; drag = null; return true; }
    return false;
  }
  canvas.addEventListener('pointerup', function (ev) {
    var wasPinch = lift(ev);
    if (!wasPinch && drag && !drag.moved) { var b = canvas.getBoundingClientRect(); tap(ev.clientX - b.left, ev.clientY - b.top); }
    drag = null;
  });
  canvas.addEventListener('pointercancel', function (ev) { lift(ev); drag = null; });
  canvas.addEventListener('mousemove', function (ev) {
    if (drag || !state) return;
    var b = canvas.getBoundingClientRect(), r = roomAtPoint(ev.clientX - b.left, ev.clientY - b.top);
    $('roomname').textContent = r ? (r.seen ? r.name : 'unexplored') : state.room.name;
    canvas.style.cursor = r && r.vnum !== state.room.vnum ? 'pointer' : '';
  });
  canvas.addEventListener('mouseleave', function () { if (state) $('roomname').textContent = state.room.name; });
  canvas.addEventListener('wheel', function (ev) { ev.preventDefault(); zoom(ev.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  function zoom(f) { var n = Math.max(30, Math.min(110, cell * f)); pan.x *= n / cell; pan.y *= n / cell; cell = n; drawMap(); }
  $('zin').addEventListener('click', function () { zoom(1.25); });
  $('zout').addEventListener('click', function () { zoom(0.8); });
  $('center').addEventListener('click', function () { pan = { x: 0, y: 0 }; drawMap(); });
  window.addEventListener('resize', drawMap);

  // ---- Expeditions: an area, a length, then the run's report -----------
  var expLen = 10;
  function expeditionActs(list) {
    var box = $('sheetacts'); box.textContent = '';
    var why = !list.length ? '' : !list[0].safe ? 'Expeditions set out from somewhere safe, like a town.' :
      list[0].wait ? 'You are still resting from the last one.' : '';
    if (why) { var note = el('div', 'dim', why); note.style.gridColumn = '1 / -1'; box.appendChild(note); }
    var lens = el('div', 'chips'); lens.style.gridColumn = '1 / -1'; lens.style.marginTop = '0';
    [5, 10, 20].forEach(function (n) {
      lens.appendChild(btn(n + ' fights', function () { expLen = n; expeditionActs(list); }, n === expLen ? 'primary' : ''));
    });
    box.appendChild(lens);
    list.forEach(function (x) {
      var b = btn('', function () { openSheet('Expedition: ' + x.name, 'expedition ' + x.area + ' ' + expLen, []); });
      b.appendChild(document.createTextNode(x.name));
      var lv = el('small', 'dim', ' · level ' + x.low + (x.high !== x.low ? '–' + x.high : ''));
      b.appendChild(lv);
      b.disabled = !!why;
      box.appendChild(b);
    });
  }

  // ---- Bottom sheet: a command's reply plus follow-up actions --------
  // A sheet shows a command's reply (if any) and buttons; an action is a
  // command to send, closing the sheet, or a function to run. A sheet that
  // follows the character sets sheetRefresh, called with each new state.
  var sheetRefresh = null;
  function openSheet(name, command, acts) {
    sheetFor = name; sheetLines = []; sheetRefresh = null; $('sheetsub').textContent = '';
    $('sheetname').textContent = name; $('sheettext').textContent = command ? '…' : '';
    var box = $('sheetacts'); box.textContent = '';
    acts.forEach(function (a) {
      box.appendChild(btn(a[0], function () { if (typeof a[1] === 'function') a[1](); else { closeSheet(); send(a[1]); } }));
    });
    $('sheet').style.display = 'flex'; $('shade').style.display = 'block';
    if (command) send(command);
  }
  function closeSheet() { sheetFor = null; sheetRefresh = null; $('sheet').style.display = 'none'; $('shade').style.display = 'none'; }
  $('sheetclose').addEventListener('click', closeSheet);
  $('shade').addEventListener('click', closeSheet);

  // The Log tab takes typed commands too, for anything without a button.
  // The box under the log says, chats, tells, or runs a command, as the
  // chosen mode prefixes it.
  var talkMode = '';
  var MODES = [['Command', ''], ['Say', 'say'], ['Chat', 'chat']];
  function renderModes() {
    var box = $('talkmodes'); box.textContent = '';
    var modes = MODES.slice();
    if (/^tell /.test(talkMode)) modes.push([talkMode.replace(/^tell /, 'Tell '), talkMode]);
    modes.forEach(function (m) {
      box.appendChild(btn(m[0], function () { talkMode = m[1]; renderModes(); $('cmd').focus(); }, talkMode === m[1] ? 'primary' : ''));
    });
    $('cmd').placeholder = talkMode ? talkMode.replace(/^tell (.*)/, 'tell $1') + '…' : 'type a command';
  }
  function talkTo(mode) { talkMode = mode; renderModes(); showTab('log'); $('cmd').focus(); }
  renderModes();
  $('cmdform').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = $('cmd').value.trim();
    if (!v) return;
    var line = talkMode ? talkMode + ' ' + v : v;
    send(line); addText('> ' + line, null, true); $('cmd').value = '';
  });

  // ---- Tabs: one pane of the panel at a time ---------------------------
  var currentTab = 'here';
  function tabButton(name) { return document.querySelector('#tabs button[data-tab="' + name + '"]') || el('button'); }
  function showTab(name) {
    currentTab = name;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('on', b.dataset.tab === name);
      if (b.dataset.tab === name) b.classList.remove('alert');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#panel [data-pane]'), function (p) {
      p.style.display = p.dataset.pane === name ? '' : 'none';
    });
    $('panel').scrollTop = name === 'log' ? $('panel').scrollHeight : 0;
  }
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.addEventListener('click', function () { showTab(b.dataset.tab); });
  });
  $('ticker').addEventListener('click', function () { showTab('log'); });
  // A tab the phone reloaded after suspending it still holds its token.
  if (resumeToken) { $('loginbtn').textContent = 'Send'; connect(); } else showQuick();
})();
</script>
</body>
</html>
