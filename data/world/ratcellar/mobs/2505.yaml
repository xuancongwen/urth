description: A swarm of rats pours along the floor like a brown, squeaking carpet.
look: |
  Not one rat but forty, or sixty, moving together the way water
  does, over and around and under each other, a living tide of fur and
  tails and teeth. It has no mind, only appetite, and it goes where
  the smell of food goes. At the moment that is you.
