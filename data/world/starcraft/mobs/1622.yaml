name: General Edmund Duke
keywords: [general, edmund, duke, alpha, squadron]
description: General Edmund Duke of Alpha Squadron inspects the gate turrets, and does not like what he sees, and does not like you.
look: |
  A thickset, red-faced Confederate general in a peaked cap and a
  greatcoat heavy with braid, a cigar clamped in his jaw and a big
  sidearm on his hip. He commands the Alpha Squadron from the
  battlecruiser Norad II, and he has come down to tell the locals that
  everything is under control, which it is not. He drawls, he
  blusters, and he has never once taken an order from a civilian.
  "Now listen here, son. This area is under martial law."
