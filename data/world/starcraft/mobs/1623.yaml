vnum: 1623
name: Executor Tassadar
keywords: [tassadar, executor, protoss, templar]
description: Executor Tassadar stands at the edge of the mesa in golden armor, looking down at the outpost his fleet may yet have to burn.
look: |
  A tall Protoss in gold armor and a long cloak, his head crested with
  bony plates, his face without a mouth, his eyes glowing a calm blue.
  He commanded the fleet that burned Chau Sara clean of the zerg, and
  every terran in Mar Sara knows it. He does not want to do the same
  here. He is beginning to think that the terrans are worth saving, and
  that his Conclave is wrong about a great many things. His voice
  arrives in your head, gently. "En Taro Adun."
