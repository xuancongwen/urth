name: Raynor's revolver
keywords: [raynor's, raynor, revolver, pistol, gun, sidearm]
description: A long-barrelled revolver with a worn wooden grip lies here.
look: |
  A heavy six-shot revolver, old-fashioned even on Mar Sara, with a grip
  worn pale by one particular hand and a marshal's star scratched into
  the frame. Jim Raynor carried it as the law on this world before the
  Confederacy took his badge, and Kross took his gun. It shoots true, it
  finishes what it starts, and the man holding it stands a little
  straighter and gets listened to.
