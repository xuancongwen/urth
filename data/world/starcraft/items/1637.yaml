description: A tarnished six-pointed star on a leather thong lies here.
look: |
  The badge of the marshal of Mar Sara, a six-pointed star of tarnished
  brass with a bullet dent in one point, hung on a thong so it can be
  worn at the throat. Jim Raynor wore it until the Confederacy decided
  he should not. Whoever wears it now stands a little taller, holds on
  a little longer when it gets bad, and gets listened to.
