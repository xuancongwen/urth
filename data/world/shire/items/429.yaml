name: Lobelia's umbrella
keywords: [lobelia, lobelias, umbrella, brolly]
description: A stout black umbrella lies here, its ferrule worn to a point.
look: |
  A long umbrella of oiled black cloth on a hickory shaft, carried in
  all weathers and never once opened. Its owner used it to point at
  what she meant to have and to poke whoever was standing in front of
  it. It finds the moment a body is off balance, and it has faced
  down bigger folk than you.
