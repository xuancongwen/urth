vnum: 427
name: a Morgul-knife
keywords: [morgul-knife, morgul, knife, blade, dagger]
description: A long thin knife lies here, with a cold gleam on it and a notched, broken-looking point.
look: |
  A slender blade of some grey metal that is not steel, the edge
  notched near the tip where a splinter is meant to break off in the
  wound and work its way to the heart. It was made in Minas Morgul. A
  cut from it does not bleed so much as freeze, and the cold spreads,
  and slows, and whispers. It whispers to the hand that holds it, too.
