vnum: 406
name: a letter to Mr. Underhill
keywords: [letter, underhill, note]
description: A folded letter has been pushed half under the door.
look: |
  Written small, in a hurry: "Leave by the Woody End and take the
  Hay if the road is watched. Do not stop under the willows by the
  river, whatever they sing. If anyone asks for Baggins, you are
  Underhill. The Riders can smell, but they cannot see." It is signed
  with a single rune.
type: other
