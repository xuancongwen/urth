description: A long, heavy sword with a guard like a crown lies here.
look: |
  The sword of Kahran Ramsus, Commander of the Gebler, made for him by
  Krelian when he was made, and as perfect as he was meant to be: long,
  straight, balanced, and so sharp that it seems to arrive before it is
  swung. He was built to be the perfect man and he was never quite good
  enough, and the sword knows it, and cuts as if to make up the
  difference.
