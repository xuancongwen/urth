description: A long white robe, spotless, embroidered with silver lies here.
look: |
  The white robe of Krelian, once a doctor of Solaris, now the prophet
  of a god he made himself: spotless, long, embroidered at the cuffs
  with silver formulae that are, if you read them, the design of a soul.
  He wanted no one ever to have to lose anyone again. Worn, it fills
  your mind with that terrible patient certainty.
