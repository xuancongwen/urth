vnum: 3857
name: a fragment of the Zohar
keywords: [fragment, zohar, shard, crystal]
description: A shard of black crystal lies here, burning with a light that is not light.
look: |
  A shard broken from the Zohar, the monolith at the heart of Deus, the
  engine of infinite energy which bound the Wave Existence and fell with
  Deus to this world ten thousand years ago. It is black and it shines;
  it is cold and it burns; it hums a note just below hearing. All the
  Ether in the world comes, in the end, from this. Held, it pours that
  power out on everything near you.
