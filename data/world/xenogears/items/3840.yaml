name: Grahf's cloak
keywords: [grahf's, grahf, cloak, mantle, cape]
description: A long black cloak, tattered at the hem, lies here like a shadow.
look: |
  The cloak of Grahf, the ghost in black who has haunted Fei's steps
  since Lahan burned, who asks every man he meets if he desires power.
  It is darker than cloth should be, and the edges of it smoke. Whoever
  wears it carries a little of his darkness about him, and whoever
  strikes him feels it bite back.
