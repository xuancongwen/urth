description: Id, with Fei's face and red hair, grins at you from the fire.
look: |
  He is Fei: the same face, the same body, the same long hair, though
  his is red, and the eyes are wrong, gleeful and empty and very old. He
  is the self that took over when the boy could not bear what had been
  done to him, who destroyed Lahan and a city of Kislev and does not
  remember being sorry. He fights with Fei's hands and Fei's arts and
  none of Fei's restraint, and he is the most dangerous single person
  you will meet in this world.
