name: Stier
keywords: [stier, inquisitor, ethos, cyborg]
description: Stier, the Ethos inquisitor, turns from the sealed door with a smile.
look: |
  A gaunt man in the robes of an Ethos inquisitor, bald and pale and
  smiling, who has been searching the excavation for something the
  church is not supposed to know is there. Under the robe he is not
  entirely flesh: his right hand is a three-clawed steel machine, and
  when he raises it the claws drip. He serves the Gazel Ministry, not
  the Ethos, and you have seen too much.
