description: Grahf, the black-cloaked ghost, steps out of the girders. "Do you desire power?"
look: |
  A tall figure in a black cloak and a domed helmet of black metal that
  hides his whole face, who appears wherever there is war, asking each
  man he meets whether he desires power. He was at Lahan when it burned.
  He is a man five hundred years dead who will not stay dead, the first
  Contact of an age ago, wearing the body of his own son. He wants Fei;
  you are in his way. He fights with his bare hands, and the dark comes
  off him like smoke.
