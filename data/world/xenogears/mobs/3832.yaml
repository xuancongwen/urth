name: Miang Hawwa
keywords: [miang, hawwa, chancellor, woman]
description: Miang Hawwa, smiling, steps out from among the monoliths.
look: |
  A beautiful woman with long blue-black hair and a red-lipped smile, in
  the robes of a Solarian chancellor. She is Miang, the woman who never
  dies: born again in a new body in every age, for ten thousand years,
  to whisper in the ears of kings and turn humanity back toward Deus.
  She has been the Empress of Kislev's mistress and the Gazel's servant
  and Krelian's lover, and she finds you interesting. She is not afraid
  of you at all.
