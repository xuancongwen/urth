look: |
  A tall, handsome man with long fair hair and the uniform of the
  Commander of the Gebler, whose face is beautiful and twisted, as
  though something were always pulling at it from inside. He was made,
  not born: Krelian built him in a tank to be the perfect man, the next
  Emperor, and then Fei Fong Wong existed, and Ramsus was not perfect
  after all. He has never got over it. He is the best swordsman in
  Solaris, and he hates you because you came here instead of Fei.
