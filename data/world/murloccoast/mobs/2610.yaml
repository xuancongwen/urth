name: King Mrgl-Mrgl
keywords: [king, mrgl-mrgl, mrgl, murloc]
description: King Mrgl-Mrgl lolls on his driftwood throne, gargling orders at nobody.
look: |
  A murloc the size of a bear, gone fat and pale in the dark of the
  grotto, his crest grown out into a ragged frill and his belly hung
  with strings of pearls. On his head sits a lopsided crown of shells.
  Everything the coast's murlocs have ever found that glittered has
  been brought to him, and he has kept it all. When he rises, which he
  does not like doing, the whole grotto rises with him.
