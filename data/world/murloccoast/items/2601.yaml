description: A tin storm lantern with a glass chimney sits here.
look: |
  A fisherman's lantern of dented tin, its glass chimney caged in wire
  against knocks and its wick trimmed short to make the oil last. It
  will burn in a gale. It will burn in a sea cave, too, which is where
  you are probably taking it.
