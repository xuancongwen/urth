vnum: 2604
name: a fish on a stick
keywords: [fish, stick, club]
description: A large, stiff, dried fish is lashed to a stout stick here.
look: |
  A whole cod, salted and dried as hard as oak, lashed head-first to a
  length of ship's spar with tarred rope. It is a club, a meal, and a
  statement. Murlocs consider it the height of the armourer's art, and
  when it connects squarely there is a wet, ringing smack that leaves
  people dazed and gulls interested.
