vnum: 2910
name: Thyra's sword
keywords: [thyra's, thyra, sword, valkyrie]
description: A long straight sword with a winged crossguard lies here.
look: |
  A valkyrie's blade, long and narrow and bright, the crossguard cast
  as a pair of spread swan's wings and the pommel a plain steel disc.
  Thyra carried it with her shield and wore armor that turned most of
  what was thrown at her. The demon mother kept it in the furnace to
  see if it would melt. It did not. It still cuts clean, and it still
  turns blows aside for whoever holds it.
