vnum: 2912
name: Merlin's staff
keywords: [merlin's, merlin, staff, wizard]
description: A gnarled wizard's staff topped with a clouded crystal lies here.
look: |
  A knotted length of blackthorn taller than you are, capped with a
  lump of crystal in which a small storm seems to be going on. Merlin
  the Wizard carried it, and leaned on it, and pointed it at things
  that stopped existing shortly afterward. The Sorcerer Supreme took it
  for himself and has never been able to make it do more than glow.
  It knows its old tricks, all the same.
