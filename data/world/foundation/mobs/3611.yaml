name: Prince Regent Wienis
keywords: [prince, regent, wienis, uncle, anacreon]
description: Prince Regent Wienis sits beside the throne, his hand on the gold-chased blaster at his belt.
look: |
  A hard, heavy man of sixty with a soldier's bearing and a courtier's
  smile, the uncle of the boy king, Regent of Anacreon, and the real
  ruler of the Four Kingdoms' strongest. He has spent thirty years
  waiting for the Foundation to grow weak, and he means to take
  Terminus and its atomic secrets with the cruiser the Foundation
  itself repaired for him. He does not believe in the Galactic Spirit.
  He has made the mistake of assuming nobody else does either. He
  draws his blaster as you come near, smiling.
