name: Hober Mallow
keywords: [hober, mallow, trader, master, merchant]
description: Hober Mallow, Master Trader, sits on a crate among his wares, grinning at you like a man about to make a sale.
look: |
  A big, swarthy Smyrnian with a trader's jacket, a trader's grin and
  a trader's eye for exactly how much you have in your purse. He won a
  war with Korell without a single battle: he sold them washing
  machines and atomic knives, then stopped selling. "Religion won't
  do any more," he says. "Trade will. A man who owns a Foundation
  transmuter is the Foundation's man for life, and doesn't even know
  it." He sells force shields, blasters, knives and transmuters, and
  he pays in kind for spent power cells, which he can recharge and
  sell again. Type 'list'.
