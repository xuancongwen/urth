name: Ebling Mis's spectacles
keywords: [ebling, mis's, mis, spectacles, glasses, lenses]
description: A pair of thick, smudged spectacles lies here.
look: |
  Thick lenses in a bent wire frame, smudged with a thumb that never
  stopped turning pages. Ebling Mis read half the Galactic Library
  through them, in weeks, and saw in it the one thing nobody else had
  seen. Wearing them, the small print of the world comes clear: the
  hidden thing, the weak joint, the line everybody else skipped.
