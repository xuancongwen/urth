vnum: 3508
name: Shenk the Overseer
keywords: [shenk, overseer, demon]
description: Shenk the Overseer bellows from his platform of bodies, whip cracking, and the imps scurry.
look: |
  The overseer of Baal's siege, a hulking, warty, hunchbacked demon in
  a breastplate of fused shields, with a lash of braided sinew in one
  fist. He drives the siege beasts with it, and the imps, and the
  enslaved, and anything else that does not move fast enough; every
  crack of it brings more imps tumbling out of the camp. He has been
  told Harrogath will fall this week. He believes it.
