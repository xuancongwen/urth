name: Lister the Tormentor
keywords: [lister, tormentor, minion, destruction, demon]
description: Lister the Tormentor bellows at his pack and lowers his head to charge.
look: |
  The chief of Baal's minions of destruction and the last of the
  waves before the throne: bigger than the rest, spiked like a siege
  tower, his hide scored with the marks of a thousand fights and the
  blade of a dead barbarian king in his fist. He leads a pack, and the
  pack is the worst thing in the keep. Everyone who has come this far
  has met Lister. Not everyone remembers him fondly.
