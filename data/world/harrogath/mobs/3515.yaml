vnum: 3515
name: Nihlathak, the betrayer
keywords: [nihlathak, betrayer, elder, necromancer]
description: Nihlathak rises from among his corpses, staff raised. "You fool! You will not stop me!"
look: |
  The elder of Harrogath, here in his true colours: the dark robe open
  over a body gone corpse-grey, the bright eyes sunk deep, the long
  fingers wet. He gave the Relic of the Ancients to Baal to save his
  own skin and the town's, he says, and Baal kept his word as Baal
  does. Around him the dead of Harrogath lie in a ring, swollen, and
  when he points at one of them it bursts.
