vnum: 3509
name: Eldritch the Rectifier
keywords: [eldritch, rectifier, enslaved, demon]
description: Eldritch the Rectifier stands among the waystones, rattling the chains on his wrists.
look: |
  A huge, bent figure in iron shackles that it broke long ago and
  kept, as weapons. It was one of the enslaved, once, a man of the
  mountain made over by Baal into something that pulls siege engines
  and does not tire. It guards the waystones on the highlands now, and
  it corrects, as it puts it, anyone who tries to reach them.
