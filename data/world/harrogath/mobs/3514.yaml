name: Pindleskin
keywords: [pindleskin, pindle, defiled, warrior, undead]
description: Pindleskin stands before the temple doors, grinning a lipless grin.
look: |
  A defiled warrior of the reanimated horde, bigger than the rest, the
  flesh gone from his skull and the skull gone yellow and polished as
  old ivory. Cursed things cling to him, and fire runs along his bones
  when he swings. He has stood at Nihlathak's door longer than anyone
  can count, and every hero who comes through the red portal meets him
  first. A great many of them come back, again and again. He seems to
  enjoy it.
