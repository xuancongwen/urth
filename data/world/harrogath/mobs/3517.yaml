vnum: 3517
name: Talic the Defender
keywords: [talic, defender, ancient, barbarian]
description: Talic the Defender steps down from his pedestal, a great maul in his stone hands.
look: |
  One of the three Ancients, the great heroes of the barbarians bound
  by the archangel Tyrael to guard the Worldstone until the end of
  days. He stands three heads taller than any man, half flesh and half
  grey stone, his eyes white fire. He is the Defender, who spins
  through his foes like a storm. "Prove yourself worthy," he says, "or
  join us here in stone." He means it kindly.
