name: Tal Rasha's Guardianship
keywords: [tal, rasha's, rasha, guardianship, robe, armor]
description: A Horadric archmage's armoured robe lies here, torn across the chest.
look: |
  The robe of Tal Rasha, the Horadric mage who bound Baal in his own
  body and was worn by him like a coat for two hundred years: purple
  silk over a lattice of gold-wired plates, written over with wards.
  The chest is torn open where the red crystal burst through. The wards
  still hold, and every blow that lands on its wearer arrives softer,
  and the thoughts run clear.
