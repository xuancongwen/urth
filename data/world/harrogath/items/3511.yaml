name: Death's Fathom
keywords: [death's, death, fathom, orb, eye]
description: A swirling orb shaped like an open eye lies here, watching.
look: |
  A black crystal orb as deep as a well, in which something drifts
  like an eye seen through dark water. It sees what is hidden, and it sharpens every
  art its holder knows so that each comes back to hand a round sooner.
  It has been looking out of Baal's hand for two hundred years, and it
  has not liked what it saw.
