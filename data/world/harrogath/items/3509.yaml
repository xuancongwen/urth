description: A colossal two-handed blade lies here, a sliver of red crystal in its hilt.
look: |
  The greater blade of Bul-Kathos, a colossus sword as long as a man,
  lost when the first king fell and reforged by Larzuk around a shard
  of the Worldstone, as the old songs said it had been made at first.
  It hits like the mountain falling, and the crystal in its hilt
  shrugs off the blows meant for its bearer. It is the sword of the
  man who founded Harrogath. Harrogath would like you to remember that.
