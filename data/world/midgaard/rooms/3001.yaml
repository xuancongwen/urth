vnum: 3001
name: The Temple of Midgaard
description: |
  You stand beneath the high vault of Midgaard's oldest temple. Pillars
  of pale stone rise into a gloom of carved stars, and the floor is
  patterned with the names of those buried under it. North, a step rises
  to the altar. South, great bronze doors stand open on the square and
  the noise of the city. West, a quieter arch leads to the halls of the
  clerics, and east an iron-studded oak door leads away from Midgaard
  altogether.
