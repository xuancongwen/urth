vnum: 3036
name: the sword of the ancients
keywords: [sword, ancients, ancient, old]
description: An ancient longsword lies here, untouched by rust.
look: |
  Older than the city, older than the temple the city was built around.
  The blade is bronze-coloured steel that no one in Midgaard knows how to
  make, and the runes along it move when you are not looking straight at
  them. The dead down here stay clear of it. Whoever wields it sees the
  things that walk unseen, and sometimes, when it strikes, the voices of
  the city's first kings strike with it.
