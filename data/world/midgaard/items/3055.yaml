keywords: [odif's, odif, backwards, collar, studded]
description: A battered studded collar, its buckle on the wrong side, lies here.
look: |
  A thick leather collar with brass studs, buckled the wrong way round
  so the tag hangs at the back. The tag reads ODIF YLTSAEB, and,
  scratched underneath in a different hand, TRY A MIRROR. Worn at the
  throat it makes you feel quick and mean and hungry, like a dog that
  has outlived every other dog at the dump.
