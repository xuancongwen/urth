vnum: 2022
name: Orcrist
keywords: [orcrist, goblin-cleaver, biter, sword, elven, blade]
description: A slender elven sword lies here, glowing a faint blue at the edge.
look: |
  The Goblin-cleaver, sister-blade to Glamdring, made in Gondolin and
  found in the same troll-hoard. It was Thorin Oakenshield's, and after
  him it lay on his tomb in the Lonely Mountain, and Balin's company
  carried it south for luck when they went to win back Moria. The luck
  ran out. Like Sting and Glamdring, it glows a cold blue when orcs are
  near, so that none of them can creep up on its bearer; the goblins
  call it Biter and run from it.
