name: Durin's axe
keywords: [durin's, durins, durin, axe]
description: A great axe of dark steel and mithril lies here, untouched by the fire.
look: |
  The axe of Durin the Deathless, father of the Longbeards, who woke
  under Mount Gundabad and walked to the Mirrormere and looked in and
  saw a crown of stars. It passed from king to king of his line, down
  to Durin the Sixth, who was slain by the thing in the deep, and it
  was lost with him. Its blade is dark steel edged with mithril, and
  the seven stars of Durin are set in its cheek. It does not belong to
  you. Carry it well.
