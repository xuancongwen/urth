  - { item: 2001, silver: 40 }
  - { item: 2001, items: [2003, 2003, 2003] }
  - { item: 2005, silver: 180 }
  - { item: 2004, silver: 350 }
  - { item: 2006, silver: 400, items: [2003, 2003] }
