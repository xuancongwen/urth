vnum: 2024
name: Boromir of Gondor
keywords: [boromir, gondor, captain, man, denethor]
description: Boromir sets his shoulder to the door of the Chamber of Records and his great horn at his belt. "They have a cave troll!"
look: |
  A tall Man of Gondor, broad-shouldered and fair of face, in a fine
  cloak gone muddy, with a round shield and a long sword and the great
  horn of the Stewards slung at his side, tipped with silver and
  written with ancient characters. He is the son of Denethor and the
  captain of Minas Tirith, and he came north to Rivendell to read a
  riddle. He is brave and proud and very tired of being told to keep
  quiet. Every so often his eyes go to Frodo, and away again. He
  will not take kindly to being troubled, and he fights like the
  captain of the White Tower.
