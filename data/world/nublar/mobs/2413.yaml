name: the clever girl
keywords: [clever, girl, velociraptor, raptor, dinosaur]
description: A velociraptor watches you from the ferns to your left. Clever girl.
look: |
  A big, scarred raptor with a torn green webbing sling still caught on
  one foreclaw, the one that took Muldoon's gun. While you looked at her
  sister in front of you, she came round the side, quiet as smoke. She
  looks at you the way you would look at a door you are working out how to
  open.
