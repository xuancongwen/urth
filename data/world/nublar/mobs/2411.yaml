description: A pteranodon unfolds its leathery wings on a girder overhead.
look: |
  A flying reptile with a wingspan wider than a car, a long toothless beak
  like a pickaxe, and a backswept crest. It is all skin and hollow bone,
  light as paper and quick as a hawk, and when it drops off the girder it
  comes straight at your eyes.
