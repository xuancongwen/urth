name: a Tyrannosaurus rex tooth
keywords: [tyrannosaurus, rex, t-rex, trex, tooth, fang]
description: A serrated tooth the size of a banana lies here.
look: |
  A tyrannosaur tooth, a foot long from root to tip, thick as your wrist
  and serrated on both edges like a bread knife. It was not shed; it was
  broken off in something that had the bad luck to be very tough. Held by
  the root, it punches through anything, and it hits hardest of all when
  the thing in front of you is already dying, as a tyrannosaur's bite
  does.
