description: A black combat shotgun with a folding stock lies here.
look: |
  A SPAS-12 combat shotgun, matte black, with a folding stock and a sling
  of worn green webbing. Robert Muldoon carried it for twenty years of
  hunting things that hunted back, and lost it in the ferns the night a
  raptor came at him from the side while he watched the one in front. It
  is loaded with solid slugs. It hits hardest when the thing in front of
  you is already hurt, and the hand that holds it learns to look left.
