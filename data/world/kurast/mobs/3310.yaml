vnum: 3310
name: Stormtree
keywords: [stormtree, thorned, hulk, storm]
description: Stormtree towers in the clearing, lightning crawling through its thorns.
look: |
  A thorned hulk the size of a hut, old and grey and scarred, its
  thorns blackened by the lightning that lives in them. The flayers
  leave offerings at its feet. It carries a great round shield torn
  off a temple door, and when it slams it into the ground the air
  cracks and smells of a storm.
