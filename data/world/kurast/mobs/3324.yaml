vnum: 3324
name: Mephisto, the Lord of Hatred
keywords: [mephisto, lord, hatred, demon, prime]
description: Mephisto drifts above the floor before the red portal, robes of flesh trailing in the blood. "Ahhh... I sense your fear."
look: |
  The eldest of the three Prime Evils, the Lord of Hatred, who
  corrupted the Zakarum from its own temple and was kept in its prison
  by the very priests he had bought. He hangs a little above the
  floor, a shape of grey-green hide and robes of skin, with a skull
  for a face and claws for hands, and he trails no legs at all. The
  red soulstone that held him burns in his chest. Frost spreads from
  him in rings, and lightning rises from the moat at his gesture. He
  is not angry with you. He hates you, which is quieter, and older,
  and lasts.
