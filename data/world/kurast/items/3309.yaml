name: Ormus' Robes
keywords: [ormus', ormus, robes, robe, dusk, shroud]
description: A shroud-like robe of dusky grey lies here, its hem crawling with tiny sigils.
look: |
  A dusk shroud of grey silk woven so fine it moves like smoke, its
  hem and cuffs embroidered with the sigils Ormus copied out of Lam
  Esen's tome, which crawl slowly round the cloth when nobody is
  watching them. Fire, frost and sparks gather around whoever wears
  it and lash out at whatever comes close. Ormus says Ormus no longer
  needs it. Ormus is not, perhaps, telling the whole truth.
