vnum: 3307
name: the Gidbinn
keywords: [gidbinn, dagger, ritual, skatsim]
description: A curved ritual dagger lies here, its blade the green of jungle shade.
look: |
  The sacred dagger of the Skatsim, curved like a crescent moon, its
  blade a stone that is neither jade nor glass, its grip bound in the
  skin of a snake that was never caught. While it stood on the altar
  of the Skatsim the jungle's evil kept its distance; the flayers stole
  it, and the jungle came for Kurast. It cuts with a slow green poison
  and clears the mind of whoever holds it. Ormus would say that the
  flow of magic has been restored.
