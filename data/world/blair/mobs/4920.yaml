name: the Workroom Copier
keywords: [workroom, copier, xerox, machine]
description: The Workroom Copier blinks PAPER JAM IN TRAY 3 and opens every drawer at once.
look: |
  A grey copier the size of a small car, with a glass bed, a sorter
  with twelve trays, a stapler built in, and a long memory for every
  teacher who ever kicked it. Its display blinks PAPER JAM IN TRAY 3,
  but there is no jam. There never was. It hums, and the trays slide
  open like jaws. Rumor says a stapler fell into its finisher in 1999
  and came out changed.
