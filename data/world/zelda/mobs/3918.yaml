look: |
  A hunched, ugly, cheerful old gravekeeper with one eye bigger than the
  other, a lantern on a stick, and a shovel he leans on. He frightens
  the village children and he likes them, and he digs, and digs. "Heh
  heh heh. Young'un, fancy a lantern for the dark? I make 'em myself.
  Bring me a Poe's soul and I'll swap you one, I'm collecting them."
