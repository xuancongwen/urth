vnum: 3951
name: Twinrova
keywords: [twinrova, koume, kotake, witches, twins]
description: Koume and Kotake, the witches Twinrova, circle each other on their brooms, cackling.
look: |
  Two tiny, ancient Gerudo witches with hooked noses and jewels on their
  foreheads, flying round each other on broomsticks: Koume, who throws
  fire, and Kotake, who throws ice. They are four hundred years old and
  they raised Ganondorf, and they bicker about how old the other one is.
  When they are hurt, they merge, cackling, into one young witch with
  fire in one hand and ice in the other.
