description: A Like Like sits in the corridor, a slimy tube with its mouth open.
look: |
  A great slimy tube of flesh, ringed and pulsing, with a mouth like a
  drain at the top, which slides toward anyone carrying a shield, gulps
  them down to the shoulders, and chews. It spits them out, eventually.
  It keeps the shield.
