vnum: 3119
name: the Smith
keywords: [smith, demon, blacksmith]
description: The Smith turns from the anvil with a great hammer in his fist. "Fresh meat for my anvil!"
look: |
  A demon twice the width of a man, hairless, burned black and red
  from the forge, with a leather apron and arms like oak trunks. He has
  taken Charsi's forge and Charsi's hammer, and he beats Rogue armour
  into shapes that suit his masters. When he swings the Horadric Malus
  it rings like a bell. He laughs while he works, and he laughs harder
  while he fights.
