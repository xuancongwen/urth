  The biggest brute in the Dark Wood, his fur grown through with moss
  and twigs until he looks half like the trees he guards. He has
  been set to keep the Tree of Inifuss, and he does it the only way he
  knows, by smashing anything that comes near it flat. His fists are
  stained red to the wrist.
