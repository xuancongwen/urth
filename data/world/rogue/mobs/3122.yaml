description: Bone Ash floats before the broken altar, robes smouldering, frost on his fingers.
look: |
  A burning dead mage, once a scholar of the monastery, now a skeleton
  in charred robes held up by a smoulder of blue fire. His bones are
  black with soot and his fingers trail frost. He calls down cold and
  curses on whatever walks into his cathedral, and he is the last thing
  that stands between you and the stair to the catacombs.
