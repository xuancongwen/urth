name: the Gull
keywords: [gull, dagger, knife]
description: A slim dagger with a hilt like a gull's wing lies here.
look: |
  A light dagger with a white bone hilt carved like a gull's spread
  wing and a blade that flashes silver even in the dark. It is a lucky
