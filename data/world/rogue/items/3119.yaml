name: the Nagelring
keywords: [nagelring, ring, nail]
description: A heavy iron ring, studded with nail heads, lies here.
look: |
  An iron ring hammered from a single horseshoe nail and studded around
  with the heads of a dozen more, ugly and heavy. Anything that strikes
  its wearer comes away with a few holes of its own, and the wearer
  seems to have better luck than they ought to. Gheed wrapped it in
  silk and charged accordingly.
