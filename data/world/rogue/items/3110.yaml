vnum: 3110
name: Blood Raven's Charge
keywords: [blood, raven's, raven, charge, bow, longbow]
description: A long bow of black wood, strung with a red string, lies here.
look: |
  A Rogue's long war bow of black yew, its grip wound with red leather
  and its tips capped with raven skulls. Blood Raven carried it against
  the Lord of Terror and carried it home again, changed. Its arrows fly
  true and sometimes burst on striking, scattering fire and splinters,
  and in the hand it makes the archer quicker and surer.
