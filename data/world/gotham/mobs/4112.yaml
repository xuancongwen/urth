name: the Joker
keywords: [joker, clown, prince]
description: The Joker grins at you from his wheelchair, which he does not need.
look: |
  A tall, thin man in a purple suit and an orange shirt, with chalk-
  white skin, green hair, red lips, and a grin that splits his face
  wider than a face should go. Nobody knows his name. He doesn't
  either, or he has several, depending on the day. He has a flower in
  his lapel that you should not get close to, a revolver he does not
  seem to need, and the patient, delighted look of a man watching a
  joke he has told before arrive at the punchline.
