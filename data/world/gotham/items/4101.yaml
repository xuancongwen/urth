name: the Joker's lapel flower
keywords: [joker, joker's, lapel, flower, boutonniere]
description: A bright purple flower on a lapel pin, trailing a thin rubber tube, lies here.
look: |
  A purple carnation of silk and wire on a pin, with a rubber tube
  running from its stem to a little bulb of something green that
  hisses when you squeeze it. It is the oldest joke in the book. It
  is funnier, the Joker always said, when the water is acid. Pinned
  on, it makes you sharper, and quicker to see the joke, and every so
  often, in the middle of a fight, it squirts.
