  Half a man and half a wolf, eight feet tall when it stands, with a
  wolf's long jaws on a man's shoulders and hands that end in black
  claws. Rags of a woodsman's clothes still hang off it. Cuts close on
  it as you watch, and it laughs, in a voice that is almost human.
