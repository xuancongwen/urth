vnum: 2118
name: Strahd von Zarovich
keywords: [strahd, von, zarovich, count, vampire, devil]
description: Strahd von Zarovich stands at the battlements, turning a page of his journal, and does not look up.
look: |
  Tall, lean, and dressed in black, with a hawk's face, a high pale
  forehead, and dark hair swept back from a widow's peak. He was a
  soldier before he was a count and a count before he was anything else,
  and he carries himself like all three. When he finally looks at you
  his eyes are red at the centre, like coals, and terribly interested.
  "I am the ancient," he says. "I am the land. And you are a guest in my
  house." Every wound you give him closes. Every wound he gives you
  feeds him.
