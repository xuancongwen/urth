name: Ireena Kolyana
keywords: [ireena, kolyana, burgomaster's, daughter, tatyana]
description: Ireena Kolyana stands by her father's coffin with a sword in her hand and two bite marks on her throat.
look: |
  A young woman with auburn hair, a strong jaw, and a sword she knows
  how to use, in a dress of dark green velvet gone shabby at the hem.
  She is the burgomaster's adopted daughter, found wandering in the
  woods as a child with no memory of where she came from. She has the
  face of the woman in the portraits in the castle, though she has never
  seen them. Twice the count has come to her window, and twice she has
  let him in without knowing why, and two marks on her neck are the
  proof. Her father died of the fear of it. She will not hide. She
  wants him buried in the churchyard, and she wants to see the sun.
level: 18
silver: 120
