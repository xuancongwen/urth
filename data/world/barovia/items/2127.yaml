name: Ezmerelda's silvered rapier
keywords: [ezmerelda's, ezmerelda, silvered, rapier, sword]
description: A slender rapier with a silvered blade lies here, gleaming even in the gloom.
look: |
  A duelling rapier with a swept hilt of blackened steel and a blade
  washed in silver from guard to point, made in some city beyond the
  mists for a woman who hunts what silver hurts. It is light and long
  and wickedly quick, made to slip through a guard and through a heart,
  and it finds the one place on a beast that matters.
