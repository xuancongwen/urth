vnum: 2134
name: a sunburst mace
keywords: [sunburst, mace, sun]
description: A mace whose head is a flanged brass sunburst lies here.
look: |
  A mace with a head of brass flanges worked as the rays of a rising
  sun, the haft wrapped in faded red cloth. Donavich's father carried it
  when there were still priests in Barovia who fought. A blessing said
  with it in hand guards the one who said it, and the god of the good
  answers louder.
