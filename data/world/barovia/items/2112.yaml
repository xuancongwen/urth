vnum: 2112
name: Rahadin's scimitar
keywords: [rahadin's, rahadin, scimitar, sword]
description: A slender curved scimitar of dark steel lies here.
look: |
  A slender curved blade of dark steel from far beyond the mists, with a
  hilt of black horn and no ornament whatever. Rahadin, Strahd's dusk
  elf chamberlain, has carried it in the count's service for longer than
  the village has stood, and it has taken the head of everyone who ever
  failed the count. It finds the gaps in armor by itself, and it is
  merciless with anyone already bleeding.
