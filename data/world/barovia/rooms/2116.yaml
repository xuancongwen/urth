vnum: 2116
name: The Deep Svalich Woods
description: |
  The road narrows to a track between trees so old and so close that
  noon is dusk here. Bones lie in the bracken, gnawed clean: deer,
  horse, and some that are neither. Claw marks are cut into the bark at
  the height of a tall man's head. Off to the west, a path trodden by
  heavy feet leads into a gully, and to the east something creaks and
  shifts among the trees, too big to be an animal. The crossroads are
  north; the road climbs south toward the castle.
