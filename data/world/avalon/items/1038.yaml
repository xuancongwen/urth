description: A sword with a white hilt, too fine for battle, lies here.
look: |
  Clarent, the sword of peace, which Arthur used to knight men and
  never carried to war, a slim bright blade with a hilt of white
  enamel. Mordred took it from the armoury at Wallingford and killed
  the king with it at Camlann. It was not made for killing and does
  it anyway, and it bites hardest into those already hurt, as a
  traitor's blade does.
