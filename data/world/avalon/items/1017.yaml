vnum: 1017
name: a scabbard blessed by the Lady
keywords: [scabbard, blessed, lady]
description: A scabbard of white leather worked with blue thread lies here.
look: |
  White doeskin over a core of lake-reed, stitched with running water in
  blue silk and fastened with a buckle of wyvern scale. The priestesses
  say the one who wears the true scabbard cannot bleed to death, however
  he is wounded, and Morgan stole the true one for that reason. This is
  not the true one, but the Lady blessed it all the same: small wounds
  close as you walk, and when you are cut near to dying the blood that
  should run out of you will not.
