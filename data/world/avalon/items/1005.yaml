name: a fae hunting spear
keywords: [fae, hunting, spear]
description: A slender spear with a leaf-shaped silver head lies here.
look: |
  The shaft is pale ash, the head a leaf of silver that never tarnishes.
  It is lighter than a spear has any right to be, and it finds the gaps
  in things, including the gaps between this world and the one beside
  it: whoever holds it sees what walks there unseen.
