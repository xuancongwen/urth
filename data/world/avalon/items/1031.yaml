vnum: 1031
name: Rhongomiant
keywords: [rhongomiant, rhongomyniad, ron, spear, lance]
description: A long spear lies here, its broad head gleaming white.
look: |
  Arthur's spear, broad-headed and long in the haft, which the old
  songs call Rhongomyniad, the striking spear. The king laid it down in
  the barrow of the old kings when he came to the isle to be healed,
  and the dead have kept it for him. Now and then, when it strikes, a
  lance of white light runs down it and out through what it has pierced,
  and it finds the heart of a wound as if it knew the way.
