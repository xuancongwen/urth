vnum: 1005
name: The Heart of the Orchard
description: |
  The oldest tree on the isle stands here, broad as a cottage, its
  lowest boughs propped on crutches of grey stone. Offerings hang from
  its twigs: ribbons, a child's shoe, a bent iron nail. Its apples are
  small and gold and very sweet. Smoke rises from a low house west, the
  rows go on to the east, and north the green hump of the Tor lifts
  over the treetops. The path runs back south.
