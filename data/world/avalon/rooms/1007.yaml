vnum: 1007
name: The Windfall Rows
description: |
  Fallen apples lie deep between the trees here, brown and soft and
  fermenting, and the air is thick with the smell of them. Wasps crawl
  drunk over the pulp. Something heavy has rooted through the mess,
  leaving furrows and the print of cloven hooves. The path is west, and
  the rows run on north among twisted trees.
exits:
  west: 1004
  north: 1008
