vnum: 525
name: Elminster
keywords: [elminster, sage, shadowdale, old, man]
description: An old man in a battered hat sits on the rim of the fountain, puffing a pipe and watching you over the stem.
look: |
  White-bearded, long-nosed, in robes that have seen better centuries
  and a hat that has seen worse. He looks like anybody's grandfather
  and smells of pipeweed and old paper. He knew Gorion, and he knows
  more about you than you do, and he is not going to tell you. "Thy
  path will be thine own to walk. I merely wished to see where it
  begins." He has errands, if you would like to be useful while you
  find out. He will also, if thou hast found a school of the art,
  teach thee a beginner's spell or two, for a price. Type 'practice'.
level: 40
flags: [peaceful, questmaster]
teaches: [magic_missile, arcane_shield, true_strike, color_spray, mage_armor, mind_spike, sleep, invisibility, see_invisible, mirror_image, find_weakness, arcane_heroism]
attack:
  verb: strike
