name: Gorion's silver ring
keywords: [gorion, gorions, silver, ring]
description: A plain silver ring lies here, worn thin.
look: |
  Worn thin on the inside by years of a scholar's hand. It is warm
  from the wearing, and with it on you find yourself thinking a little
  more slowly and a little more clearly. When things go very badly it
  grows warmer still, the way a hand on your shoulder does.
