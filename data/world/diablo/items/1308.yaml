vnum: 1308
name: the Undead Crown
keywords: [undead, crown, leoric]
description: A crown of tarnished gold lies here, its gems dark.
look: |
  A king's crown, heavy, with five points and a garnet in each. The gold
  is cold and stays cold against the brow, and the garnets brighten a
  little every time blood is spilled near them. Worn, it drinks from the
  wounds you give and closes your own, which is how a dead king kept his
  court standing long after it should have fallen.
