vnum: 1303
name: the Butcher's Edge
keywords: [butcher's, butcher, edge, cleaver, reforged]
description: A cleaver of bright, folded steel lies here, still warm from the forge.
look: |
  Griswold took the Butcher's iron, broke it, and folded it back
  together with good steel until the rot was hammered out of it. The
  shape is the same. The edge is new, and it bites deep and seeks the
  soft places the old owner knew so well; when it finds one, it opens it
  wide, and it is merciless to anything already staggering.
