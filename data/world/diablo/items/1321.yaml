name: the Stone of Jordan
keywords: [stone, jordan, soj, ring]
description: A plain gold ring set with a single dark stone lies here.
look: |
  A band of red gold set with one smooth stone the colour of deep water,
  so plain you would pass it on a market stall. It is not plain. Every
  skill you know comes quicker with it on, as if your hands had
  practised a year overnight, and your thoughts run clear and deep.
  Traders in the east reckon all other prices against it. Diablo kept it
  close; even the Lord of Terror knows its worth.
