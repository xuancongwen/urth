vnum: 1340
name: the Veil of Steel
keywords: [veil, steel, helm, lachdanan]
description: A great helm with a closed face of fine steel mesh lies here.
look: |
  Lachdanan's own helm, a great barrel of black steel with no eye slits
  at all: the face is a veil of mesh so fine you can see through it
  and nobody can see in. It narrows the world somewhat. In exchange,
  very little gets through it, and whoever wears it stands straighter
  and harder to move, as the captain of the guard once did.
