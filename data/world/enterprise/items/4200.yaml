vnum: 4200
name: Kirk's bamboo cannon
keywords: [kirk, kirk's, bamboo, cannon, tube]
description: A crude tube of bamboo bound with vine, its mouth blackened, lies here.
look: |
  A length of thick bamboo, bound along its length with vines and
  packed at the breech with a powder of sulphur, saltpetre, and
  charcoal ground on a rock, and loaded with raw diamonds. A Starfleet
  captain made it on this planet with his bare hands to stop a Gorn,
  and it did. It should not work as well as it does. It throws its
  diamonds like a shotgun throws shot, and now and then it throws them
  all at once.
