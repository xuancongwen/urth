name: Quel'Serrar
keywords: [quel'serrar, quelserrar, quel, serrar, sword, blade]
description: A slender elven blade of blue steel lies here, faintly smoking.
look: |
  An ancient blade of the high elves, long and narrow, its steel a deep
  sea blue and its guard shaped like a pair of swept wings. Legend says
  it must be tempered in a dragon's breath to wake, and this one has
  been: the drake slept on it for a century. It is a defender's sword.
  It turns aside blows as if it knew them in advance and makes its
  bearer hard to hit and harder to hurt.
