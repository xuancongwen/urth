name: the Warchief's black plate
keywords: [warchief, warchiefs, black, plate, armor, armour]
description: A suit of black plate lies here, no two pieces from the same smith.
look: |
  A breastplate off a human knight, pauldrons off an ogre, tassets
  off something with more legs, all of it blacked with soot and oil
  and riveted to fit one very large orc. Each piece was taken from an
  enemy who no longer needed it. It turns a blow, and whoever wears
  it into a fight does not expect to be the one who falls.
