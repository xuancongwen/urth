description: Zul'jin, warlord of the Amani, crouches on a stump by the fire pit, an axe in each hand and murder in his one good eye.
look: |
  The warlord of the Amani forest trolls, lean and tall even for a
  troll, with tusks capped in iron, a mane of red hair tied up in
  bones, and an old scar where the elves put out his left eye. He
  leads the trolls in this war because he hates the elves more than he
  hates the orcs, and he has never forgotten anything. Trolls mend
  fast; Zul'jin mends faster. "You gonna die here, mon."
