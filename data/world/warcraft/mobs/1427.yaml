description: Khadgar, a young mage in purple robes, scribbles notes against the waystone while keeping one eye on his master.
look: |
  A young man, barely past being a boy, in the violet robes of the
  Kirin Tor, his satchel heavy with books and his fingers inky. Dalaran
  sent him to be Medivh's apprentice, and also, though he would never
  say so, to keep an eye on him. He is clever, eager, and frightened in
  equal parts. He would very much like to study the fel magic the orc
  warlocks use, and he will give a Kirin Tor signet to whoever brings
  him one of their scorched skulls and a pair of red dragon scales.
  Type list.
