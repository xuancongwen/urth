vnum: 3205
name: the Staff of Kings
keywords: [staff, kings, sceptre]
description: A short staff of gold and black wood lies here, slimed from a maggot's gut.
look: |
  The shaft of a Horadric staff, sawn short and capped with a gold
  head in the shape of a crown, once carried by the kings of Aranoch
  who did not know what it was. It hums against the palm, wanting its
  other half. It makes a passable club in the meantime. Lysander would
  know what to do with it and the Amulet of the Viper together.
