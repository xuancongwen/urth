vnum: 3215
name: Bloodwitch the Wild
keywords: [bloodwitch, wild, huntress, cat]
description: Bloodwitch the Wild looks up from the bones, muzzle red, and smiles a cat's smile.
look: |
  A huntress of the sabre cats, larger than the rest, her hide marked
  in stripes of dried blood she has painted on herself. She runs on
  two legs as easily as four. She came into the Halls of the Dead
  following the smell of something old and Horadric, and she has made
  a den of the inner tomb. Among the bones at her feet sits a small
  cube of gold-chased metal she does not understand and will not give
  up.
