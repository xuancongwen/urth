    params: { kind: fire, chance: 0.2, power: 1.0, verb: "bolt of crackling fire" }
  - kind: chill
    params: { chance: 0.2, mult: 0.7, rounds: 2 }
  - kind: lastStand
    params: { threshold: 0.3, mult: 0.75 }
  - { kind: resist, params: { kind: magic, amount: 0.5 } }
