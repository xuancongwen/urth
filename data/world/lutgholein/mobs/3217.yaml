description: Beetleburst rears up out of the pool, sparks pouring off its shell.
look: |
  A great black scarab, champion of the dung soldiers, its shell gone
  blue-white with stored lightning so that it hurts to look at. It
  wades in the oasis to cool itself and comes out hissing steam. When
  it is hit the lightning goes back out of it in all directions, and
  it is hit often enough to have learned to enjoy that.
