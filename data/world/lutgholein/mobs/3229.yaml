vnum: 3229
name: Duriel, Lord of Pain
keywords: [duriel, lord, pain, demon, maggot]
description: Duriel rears up from behind the chained archangel, hissing. "Looking for Baal?"
look: |
  A monstrous thing of armour and appetite, a maggot the size of a
  house grown huge on suffering, with crablike claws for arms and a
  shell of black chitin plated over its back. Its face is a mass of
  jaws. The air around it freezes, and everything near it moves as
  though through cold honey. The Lord of Pain was left in Tal Rasha's
  chamber by his brothers to guard their prisoner and to greet the
  hero who followed them, and he has been looking forward to it.
level: 38
health: 5000
