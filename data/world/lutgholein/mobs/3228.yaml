name: Ancient Kaa the Soulless
keywords: [ancient, kaa, soulless, mummy, unraveler]
description: Ancient Kaa the Soulless rises from the sun-disc dais, wrappings unwinding like smoke.
look: |
  The oldest of the tomb's priests, so old that his wrappings have worn
  through in places to a dark husk of skin. He has no soul left to
  speak of, only orders, and the orders are that no one passes the
  Orifice. His glaive has opened every grave robber who came this far,
  and as he fights the guardians stir in their alcoves, and the dead he
  has made get up again.
