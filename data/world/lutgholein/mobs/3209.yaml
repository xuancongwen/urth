vnum: 3209
name: Drognan the wizard
keywords: [drognan, wizard, mage, sage]
description: Drognan reads a crumbling scroll by lamplight, lips moving.
look: |
  A grey-bearded old wizard in midnight-blue robes worked with silver
  stars, with the long patient face of a man who has read every book
  in the room twice. He was a Vizjerei once and is ashamed of what they
  became. "Horazon," he says, tapping a page. "The great summoner. He
  built a sanctuary out of the world, and some say his madness lives in
  it still. Look beneath the palace." He sells a staff or two to those
  who would take up the art. Type 'list'. He teaches, too, to those
  sworn to a school. Type 'practice'. "The Summoner keeps a leaf
  of Horazon's own grimoire about him," he says, "the Weird, a spell
  of fear. And when Tyrael was bound, they say his ward of seven
  colours fell at his feet. It lies there still, under the Lord of
  Pain."
level: 30
flags: [peaceful]
teaches: [cone_of_cold, phantasmal_killer, iron_body, tensers_transformation, cloudkill, globe_of_invulnerability, true_seeing, hold_monster, chain_lightning, mislead, circle_of_death, disintegrate]
attack:
  verb: rap
