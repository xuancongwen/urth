vnum: 3210
name: a sand raider
keywords: [sand, raider, bandit, nomad]
description: A sand raider crouches behind a rock, scimitar bared, eyes narrowed under a head-wrap.
look: |
  A demon dressed as a nomad, or a nomad who became a demon: it is hard
  to say which and it does not matter. Its face under the head-wrap is
  grey-green and noseless, and it moves in a crouching scuttle, curved
  blade low. They hunt in bands along the caravan trails and leave
  nothing but the camels' bones.
level: 28
flags: [assist]
attack:
  kind: slash
  verb: slash
