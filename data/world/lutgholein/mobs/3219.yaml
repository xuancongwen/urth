vnum: 3219
name: Coldworm the Burrower
keywords: [coldworm, burrower, maggot, queen, worm]
description: Coldworm the Burrower lifts its vast pale bulk from the egg heap, and the nest shudders.
look: |
  The queen of the sand maggots, a white bloated thing as long as a
  barge, its hide cold and clammy to the touch in the heat of the
  desert. Its body is a factory of eggs, and it lays them as it
  fights; the young come out of them hungry. Somewhere in its gut it
  swallowed a caravan carrying a Horadric staff, and the staff did not
  digest.
