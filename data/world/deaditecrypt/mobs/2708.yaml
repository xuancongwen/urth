vnum: 2708
name: the Pit witch
keywords: [pit, witch, hag, crone]
description: The Pit witch crouches by her green fire, cackling over her treasures.
look: |
  A withered hag with long grey hair matted with mud, eyes that shine
  green in the firelight, and fingers like roots. She has lived at the
  bottom of the pit since before the castle was built, and she has
  collected things that fell in: rings, swords, men. The latest of those
  things is a chainsaw. She is very attached to it.
