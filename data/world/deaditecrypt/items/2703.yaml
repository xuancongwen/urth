vnum: 2703
name: Ash's chainsaw hand
keywords: [ash's, ash, chainsaw, hand, saw]
description: A chainsaw with a steel cuff where its handle should be lies here.
look: |
  A two-stroke chainsaw with the handle cut off and a steel cuff welded
  on, to fit over the stump of a right hand. It starts on the first
  pull, every time, which no chainsaw has ever done. When it bites, it
  chews, and now and then it catches and roars and tears a second, worse
  wound. It is surprisingly comfortable. That is the worrying part.
