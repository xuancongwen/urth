name: the glaive of the Unmade
keywords: [glaive, unmade, fel, blade]
description: A towering glaive of black iron and green flame lies here, still burning.
look: |
  Taller than you, and heavier than it looks, which is saying a great
  deal. The blade is a jagged crescent of fel iron wreathed in green
  fire that does not go out and does not burn the hand that holds it,
  quite. Everything else it touches catches, and keeps burning. It has
  cut worlds. It would like to cut another.
