name: the staff of Ner'zhul
keywords: [staff, ner'zhul, nerzhul, shadowmoon]
description: A staff of black wood topped with a hooked blade of bone lies here, frost on its haft.
look: |
  The staff of the elder shaman of the Shadowmoon, carved from black
  wood with a curved blade of bone lashed to the top like a reaper's.
  It once called the spirits of Draenor; now it calls something colder,
  and the cold stays in the wounds it makes. It steadies the mind that
  holds it, and makes that mind quietly certain of itself.
