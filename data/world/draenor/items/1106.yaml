vnum: 1106
name: the Warchief's executioner axe
keywords: [warchief, warchief's, executioner, axe, gorvash]
description: A great two-handed axe of glowing fel iron lies here.
look: |
  A crescent blade as wide as a shield, on a haft of blackened wood
  bound in iron. The green in the metal pulses when you lift it, and the
  axe seems to lean toward the nearest living thing; when it bites, the
  fel drinks, and the one who holds it feels stronger. It was made for
  heads on the block, and it never misses a neck that is already bowed.
  Every clan the warchief broke is notched into the haft.
type: weapon
