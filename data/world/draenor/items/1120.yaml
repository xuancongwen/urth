vnum: 1120
name: a Warglaive of Azzinoth
keywords: [warglaive, azzinoth, glaive, illidan]
description: A curved, double-ended blade of fel steel lies here, trailing green flame.
look: |
  One of a pair of great crescent blades, gripped in the middle and
  edged at both ends, taken by Illidan Stormrage from the doomguard
  Azzinoth at the Well of Eternity ten thousand years ago. Green fire
  streams from the edges and clings to whatever they cut. It moves like
  a dancer in the hand, and it lends its bearer a little of the
  Betrayer's sight, so that nothing hidden by magic stays hidden. The
  tidecaller keeps it for her master and would very much like it back.
