name: Sephiroth
keywords: [sephiroth, one-winged, angel, soldier]
description: Sephiroth waits over the light, the Masamune held loosely at his side.
look: |
  Tall and terrible and beautiful, with long silver hair and cat's
  green eyes, in a long black coat, holding a sword longer than he is:
  Sephiroth, the greatest of SOLDIER, who learned in a cellar in
  Nibelheim that his mother was Jenova and decided the Planet was his.
  He burned Nibelheim. He killed Aerith. He has called Meteor down,
  and will take the Lifestream that rushes to heal the wound and
  become a god. A single black wing unfolds from his right shoulder as
  you look: he is not done changing, and the next shape he takes will
  be worse. "I am the chosen one." He is a fight for a whole party.
