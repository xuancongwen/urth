  A young woman in a long pink dress and a short red jacket, with her
  brown hair in a long braid tied with a pink ribbon, and green eyes
  that laugh at you. She grows flowers in the church and sells them on
  the plate for a gil apiece. She is the last of the Cetra, the
  Ancients, and she can hear the Planet talking; she says it is a
  little sad. She will teach those who serve the Good god how to bless
  and how to heal many at once (type 'practice'), and she sells her
  flowers and an old staff she does not need (type 'list').
