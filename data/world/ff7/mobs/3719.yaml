name: the Midgar Zolom
keywords: [midgar, zolom, serpent, snake]
description: The Midgar Zolom rears out of the swamp, dripping, higher than a house.
look: |
  A snake as long as a train, green-black and scaled, with a head
  bigger than a wagon and a throat that swallows chocobos whole. It
  lives in the marsh south of Kalm, and everyone who crosses it hires
  a chocobo and runs. Someday someone will find it impaled on a dead
  tree by a man with a very long sword. Not today.
