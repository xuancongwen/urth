description: Jenova BIRTH writhes in the open tank, its red eye fixed on you.
look: |
  The thing Shinra found in a two-thousand-year-old geological layer
  and called an Ancient: a pale, mottled body with a woman's torso and
  a writhing mass of tentacles below, one glaring red eye and a mouth
  that is not a mouth. It is Jenova, the Calamity from the Skies, and
  it is waking. Its cells are in Sephiroth, and in Cloud, and in every
  SOLDIER. It speaks to them. It is speaking to you now.
