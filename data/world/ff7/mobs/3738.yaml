name: Jenova SYNTHESIS
keywords: [jenova, synthesis, alien, calamity]
description: Jenova SYNTHESIS hangs from the cavern roof, writhing and whole.
look: |
  Every piece of Jenova, drawn together at last at the bottom of the
  crater: a vast, pulsing mass of pale flesh hanging from the cavern
  roof, with a body like a great seed-pod and tentacles that end in
  hands. It is counting down. "Ultima," it whispers, without a mouth.
  It is the reunion every black-cloaked man was walking toward, and
  Sephiroth is beyond it.
