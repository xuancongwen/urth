vnum: 3771
name: the Knights of the Round materia
keywords: [knights, round, materia, orb, summon, kotr]
description: A red orb as big as a fist, full of tiny moving lights, lies here.
look: |
  The rarest summon materia in the world, a sphere of red crystal in
  which, if you look closely, thirteen tiny armoured figures ride in a
  ring. Ultima Weapon carried it in its body, taken from the sea
  island where it lay hidden. Held and called on, it brings the
  Knights of the Round down out of the sky one after another, each
  blade a falling star, until the last one, the king, strikes with
  Ultimate End. Even unspoken, their blades are always falling round
  whoever carries it.
