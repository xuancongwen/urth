name: the White Witch's wand
keywords: [white, witch, witchs, wand]
description: A slender wand of white metal lies here, frost creeping out from it across the ground.
look: |
  A rod as long as your forearm, cold enough to burn the hand. Wherever
  it touches, a skin of frost forms and spreads. It was made for turning
  living things to stone, and it has not lost the habit: what it strikes
  goes stiff and slow and grey at the edges, and a thing half turned to
  stone breaks easily.
