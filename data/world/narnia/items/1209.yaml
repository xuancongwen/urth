vnum: 1209
name: Rhindon
keywords: [rhindon, lion-hilted, lion, longsword, sword, peter, peters]
description: Rhindon, a longsword with a golden lion on its hilt, rests here.
look: |
  A straight, bright blade, well balanced and a little long for most
  hands. On the cross-guard a lion is worked in gold, rampant, as if it
  were about to leap. It is Rhindon, the sword Father Christmas gave
  the eldest son of Adam, and the first thing it killed was Maugrim.
  It feels like a gift given in earnest: it steadies the hand that
  holds it, and it does not let a wounded wolf get up again.
type: weapon
