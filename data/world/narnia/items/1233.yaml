name: Reepicheep's rapier
keywords: [reepicheep, reepicheeps, rapier, mouse, sword]
description: A tiny rapier with a crimson feather tied to its hilt lies here.
look: |
  A mouse's sword, a perfect little rapier of bright steel with a
  swept hilt and a crimson feather knotted at the guard. To a man it
  is a dagger, and a very quick one. Its owner feared nothing in the
  world and meant one day to sail off the edge of it, and whoever
  holds it catches blades on
  it, keeps their feet when they ought to fall, and fights with the
  wrist rather than the shoulder.
