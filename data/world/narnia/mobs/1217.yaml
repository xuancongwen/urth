vnum: 1217
name: a centaur sentry
keywords: [centaur, sentry]
description: A centaur sentry paces the edge of the camp, bow in hand, watching the wood.
look: |
  A horse from the waist down, bay-coated and glossy, and a stern man
  from the waist up, with a beard like a river and eyes that have read
  the stars. He nods to you gravely and goes on watching. "The stars
  keep their courses, and the wood keeps its balance," he says, "and
  those who serve the balance may learn from me how the roots hold and
  how the bark hardens."
level: 7
flags: [peaceful]
teaches: [entangle, barkskin]
attack:
  verb: kick
