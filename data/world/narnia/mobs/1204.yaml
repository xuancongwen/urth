name: Mrs Beaver
keywords: [beaver, mrs, merchant]
description: Mrs Beaver bustles between the stove and the shelves, packing provisions into bundles.
look: |
  A kindly old beaver in an apron, with her sewing glasses pushed up on
  her forehead. She keeps the lodge stocked for whoever needs to cross
  the wood in a hurry, and she will not let anyone leave without
  something warm to wear and something to eat. She will also take your
  hare pelts and turn them into boots, if you ask nicely.
