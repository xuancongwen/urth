vnum: 2201
name: a witcher's silver sword
keywords: [witcher's, witcher, silver, sword]
description: A silver-edged sword lies here, bright as frost even in the dark.
look: |
  The second sword, the one a witcher wears for monsters: a core of
  meteorite steel with silver beaten along both edges, too soft for
  fighting men and terrible for everything else. The blade is chased
  with runes of Igni and Quen, and the leather of the grip is shaped to
  a hand that has not held it for a long time. The werewolf dragged it
  back to its den with the rest of its owner. It bites deepest where a
  beast is weakest, and it is never in a hurry to let one get up.
