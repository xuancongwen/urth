vnum: 2203
name: Imlerith's mace
keywords: [imlerith's, imlerith, mace, morningstar, hunt]
description: A huge spiked mace of black iron lies here, furred with frost.
look: |
  The mace of Imlerith, general of the Wild Hunt: a head of black iron
  the size of a man's chest, ringed with spikes, on a haft as long as a
  spear. Frost grows on it in feathers and never melts, and it is so
  heavy that lifting it is a test and swinging it is an argument with
  the ground. Whatever it hits feels the cold of the world beyond the
  sky and slows, and stays slow.
