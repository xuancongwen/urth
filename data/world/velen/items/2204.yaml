name: the Crones' rune
keywords: [crones', crones, rune, stone, ladies]
description: A flat black stone carved with a rune lies here, and the air around it is cold.
look: |
  A flat stone the size of a child's hand, black and smooth as if it had
  been held for a hundred years, carved with a single rune that does not
  stay the same shape while you look at it. The Ladies of the Wood kept
  it by the cauldron. Held, it whispers. Things near its bearer wither
  and rot, and what they lose, the bearer gains.
