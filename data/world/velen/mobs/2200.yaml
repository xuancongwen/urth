vnum: 2200
name: the innkeeper
keywords: [innkeeper, keeper, barkeep, landlord]
description: The innkeeper wipes a tankard with a rag that makes it dirtier.
look: |
  A stout, tired man with flour on his apron and a cleaver within reach,
  who has served Temerians, Redanians, Nilfgaardians, and deserters from
  all three, and charged them all the same. He sells lanterns for the
  dark places, Swallow for the people who go into them, and gwent cards
  for the people who have the sense not to. He also pays out on the
  contracts from the board, in kind: bring him drowner brains, nekker
  hearts, or a griffin's feathers as proof of the work, and he has good
  leather in the back. Type 'list' to see what he has.
