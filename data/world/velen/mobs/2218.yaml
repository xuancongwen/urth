description: Imlerith of the Wild Hunt stands before the altar, his great mace on his shoulder.
look: |
  The Wild Hunt's general, a giant of an elf in black plate thick as a
  door, spiked at every edge and rimed with frost. His helm is a crown
  of iron horns, and his mace is the size of a child. He has come to
  Bald Mountain to meet the Crones, and to collect what they promised
  him. He has done this on a hundred worlds. He has never lost.
