name: Tika's frying pan
keywords: [tika's, tika, frying, pan, skillet]
description: A heavy iron frying pan lies here, blackened with years of spiced potatoes.
look: |
  Cast iron, long-handled, and heavier than it has any business being.
  Tika Waylan uses it for potatoes, and for the customers who get ideas,
  and for the one draconian who got through the door. Whoever it rings
  off tends to stand there seeing stars for a moment, and that moment is
  exactly when a second swing does the most good.
