name: Brightblade
keywords: [brightblade, bright, blade, sword, solamnic, two-handed]
description: A great two-handed sword of antique make leans against the rail, its blade catching the lamplight.
look: |
  A Solamnic greatsword, old when Sturm's grandfather's grandfather
  carried it, the kingfisher and the rose worked into the crossguard.
  The knights say it will never break so long as its bearer's honour
  holds, and it does seem heaviest in the hands just when a fight is
  nearly lost and giving up would be easiest. Est Sularus oth Mithas is
  cut along the fuller: my honour is my life. It was lost in Darken
  Wood, and the dead there keep it for someone worthy of it.
