vnum: 312
name: the Staff of Magius
keywords: [staff, magius, crystal, claw, dragon]
description: A black wooden staff topped with a crystal in a golden dragon's claw lies among the roots.
look: |
  Plain dark wood shod in silver, and at its head a crystal globe held
  in a small golden claw. It belonged to Magius, who fought beside Huma
  in the Lost Battles, and the spirits of Darken Wood have kept it for a
  very long time for a mage who has not yet come. When you speak the word
  it knows the crystal gives a cold light. It wards whoever holds it,
  shows what hides behind glamour, and now and then, when it strikes,
  the air around it tears with a small arcane crack.
type: weapon
