name: Fewmaster Toede
keywords: [toede, fewmaster, hobgoblin, captain]
description: Fewmaster Toede, a fat hobgoblin in a too-small doublet, sits on a wagon, shouting at the others.
look: |
  Fatter than a hobgoblin should be, dressed in stolen finery two sizes
  too small, and holding a whip he does not need. He is Fewmaster
  Toede of the Red Dragonarmy, and he answers to Lord Verminaard, and
  he is looking for a blue crystal staff, and for someone to blame
  when he does not find it.
