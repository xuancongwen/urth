vnum: 303
name: Raistlin
keywords: [raistlin, mage, hooded, frail]
description: A frail young mage in red robes sits apart, coughing into his sleeve, watching everything.
look: |
  Thin as a stick, skin with a gold cast to it, and eyes that do not look
  at you so much as through the years you have left. He leans on a staff
  and coughs, and when the coughing stops his voice is very quiet and
  very sure. He would teach you nothing. He is not the sharing kind.
level: 15
flags: [sentinel, peaceful]
attack:
  verb: strike
