name: Matron Malice's tentacle rod
keywords: [malice, tentacle, rod, matron]
description: A black rod ending in a knot of purple tentacles lies here, the tentacles still twitching.
look: |
  The rod of a Matron Mother of Menzoberranzan: a haft of black iron
  ending in six purple tentacles as long as your forearm, each one
  barbed, each one alive. They lash on their own, and where they touch
  the flesh goes slow and numb. Matron Malice used it on her children
  more often than on her enemies.
