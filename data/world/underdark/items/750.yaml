vnum: 750
name: the Burrow-Warden's hammer-hand
keywords: [hammer, hammer-hand, hand, mithral, belwar, burrow-warden]
description: A mithral hammer-head on a wrist cuff lies here, runes crawling over its face.
look: |
  A block of mithral the size of two fists, fixed to a cuff that
  buckles over the forearm, made for a deep gnome who had lost the
  hand it replaces. The runes on it wake when its wearer says the
  words, and then it breaks stone as a pick breaks salt. It was the
  right hand of the Most Honored Burrow-Warden of Blingdenstone.
