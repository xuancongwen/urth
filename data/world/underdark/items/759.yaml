description: A plain chain of grey links set with a single rough gemstone lies here.
look: |
  The only ornament the king of the svirfneblin wears: a chain of grey
  iron links, each one shaped by a different burrow-warden, with a
  rough uncut gem at the centre that is warm to the touch. Deep gnomes
  feel the stone around them as other folk feel the wind; whoever
  wears this feels a little of it too, and nothing hides from them
  for long.
