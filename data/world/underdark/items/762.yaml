vnum: 762
name: the holy symbol of House Do'Urden
keywords: [holy, symbol, house, do'urden, malice, lolth]
description: A pendant of black adamantine, a spider with a matron's face, lies here.
look: |
  A spider of black adamantine with eight ruby eyes, and on its back the
  face of a drow woman: Matron Malice's own, the priests of Lolth say,
  cut when she took the house. It is warm, and it is never still.
  Lolth's gifts come stronger through it, and a prayer to her wraps the
  one who says it in webs of shadow.
