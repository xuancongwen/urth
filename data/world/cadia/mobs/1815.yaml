vnum: 1815
name: Abaddon the Despoiler
keywords: [abaddon, despoiler, warmaster, chaos, black, legion]
description: Abaddon the Despoiler stands at the edge of the breach, watching Cadia die.
look: |
  The Warmaster of Chaos, first captain of the Sons of Horus, who has
  led thirteen Black Crusades out of the Eye and has come at last to
  the end of this one. He is enormous in Terminator plate of black and
  gold, his topknot hanging over one shoulder, the daemon sword
  Drach'nyen on his back and the Talon of Horus on his right hand,
  crackling. He turns to look at you with something like interest. It
  is the worst thing that has ever happened to you.
