vnum: 1800
name: Quartermaster Venn
keywords: [quartermaster, venn, munitorum, clerk]
description: Quartermaster Venn stamps a requisition slip, then another, then another.
look: |
  A narrow, grey man in a Munitorum greatcoat with ink to the elbows and
  a bionic eye that whirs as it reads serial numbers. He has supplied
  this trench through four counter-attacks and a daemon incursion and
  has lost, in that time, not a single form. He will sell to anyone
  with coin, and he will trade the good kit from the back for promethium,
  because the tanks are thirsty and the cults keep stealing it.
  Type 'list' to see what he has.
level: 30
