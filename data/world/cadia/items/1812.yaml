vnum: 1812
name: the Talon of Horus
keywords: [talon, horus, lightning, claw, combi-bolter, abaddon]
description: A long-fingered lightning claw fused to a combi-bolter lies here, crackling.
look: |
  The weapon of the Warmaster Horus, taken from his corpse by the son
  who killed him: a gauntlet of black ceramite ending in four long
  blades sheathed in lightning, with a twin-barrelled bolter riding the
  back of the wrist. Ten thousand years have not dulled it. The claws
  find the gap in anything, the bolter speaks between strokes, and the
  hand inside it grows stronger and harder to kill.
