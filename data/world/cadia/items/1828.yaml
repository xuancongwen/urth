name: Duty, Lord Castellan Creed's laspistol
keywords: [duty, creed's, creed, hot-shot, laspistol, pistol]
description: A long, ornate hot-shot laspistol lies here, its grip worn to the shape of one hand.
look: |
  One of the Lord Castellan's pair of hot-shot laspistols, Duty and
  Vengeance, this one engraved along the barrel with the word DUTY in
  plain Gothic letters. It fires a needle of las that cuts through
  flak like paper, and it has never once failed to fire. Carried, it
  steadies the hand, and the men around you seem to stand a little
  straighter for seeing it.
