  A spirit stone of Craftworld Ulthwé, black as the craftworld's armour,
  with a mote of light inside that drifts as you turn it, as if it were
  looking out. The Aeldari wear them to catch their souls when they die.
  This one is empty, for now. Worn at the breast it quickens the step
  and sharpens the mind, and the things that walk unseen are seen.
