name: Tyrael's Might
keywords: [tyrael's, tyrael, might, sacred, armor, armour]
description: A suit of silver and gold armour lies here, light as a held breath, shining.
look: |
  Sacred armour of silver over gold, worked with wings across the
  shoulders and the sigil of Justice on the breast. It was made for an
  Archangel and weighs nothing at all on a mortal; it moves like silk
  and turns a blade like a fortress wall. Whoever wears it fights
  harder, moves quicker, stands longer, and sees what Hell would rather
  hide. Jamella says it came to her honestly. Tyrael has not asked for
  it back.
