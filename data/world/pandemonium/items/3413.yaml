description: A heavy book bound in scarlet hide lies here, its pages smouldering.
look: |
  One of the Grand Vizier's books, bound in a scarlet hide that is warm
  to the touch, its pages burning at the edges and never burning
  through. It holds the words that keep Diablo's seals open, and many
  others, and they rearrange themselves while you read. Held open, it
  sharpens the mind fiercely and steadies the hand, and shows you what
  is trying not to be seen.
