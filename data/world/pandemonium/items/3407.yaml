vnum: 3407
name: the Hellforge Hammer
keywords: [hellforge, hammer, maul]
description: A huge hammer with a head of black iron, glowing red at the face, lies here.
look: |
  The hammer of the Hellforge, on which every weapon of Hell's armies
  was beaten out: a haft of black iron as tall as a man and a head that
  glows at the striking face as if it had come out of the fire a moment
  ago and always will. The Horadrim wrote that it could break a
  soulstone. It breaks most other things easily enough, and what it
  hits keeps burning. Halbu the smith would very much like to hold it.
