  - { kind: resist, params: { kind: drain, amount: 0.5 } }
  - { kind: resist, params: { kind: cold, amount: 0.25 } }
  - { kind: resist, params: { kind: fire, amount: -0.25 } }
  - { kind: resist, params: { kind: holy, amount: -0.5 } }
