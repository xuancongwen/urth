vnum: 3408
name: Izual, the fallen angel
keywords: [izual, fallen, angel, lieutenant]
description: Izual turns in the bottom of the crater, broken wings spreading. "Is this some new torment?"
look: |
  He was the greatest of Tyrael's lieutenants, who led the angels into
  Hell during the Sin War and was taken alive. They tortured him until
  he told them the secret of the soulstones, and then they twisted him
  into this: a hulking blue-grey thing in the wreck of angelic armour,
  wings of torn dark shadow, eyes that remember what he was. His touch
  is frost. He hates himself, and that is the last of him that is
  still an angel. Kill him, and his spirit will be free to go home.
level: 47
