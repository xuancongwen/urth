description: Lord De Seis draws his sword before his knights. "Your time is up, mortal!"
look: |
  The first and greatest of Diablo's knights, taller than any of his
  oblivion knights, in a suit of black plate wrought with a thousand
  years of oaths. He swore himself to the Lord of Terror when Hell was
  young and has never broken his word, and his armour is the oath given
  form: whatever strikes it is struck back. He is very fast for a dead
  thing, and he does not stop.
