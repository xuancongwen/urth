vnum: 870
name: Haplo's rune-bandages
keywords: [haplo, haplos, rune-bandages, rune, bandages, wrappings]
description: A tangle of stained linen bandages lies caught on the rock, blue marks showing through the weave.
look: |
  Long strips of linen, the kind a Patryn winds over his hands to hide
  the sigla tattooed on his skin. Something of the runes has soaked
  into the cloth: wrapped in them your fists strike like a Patryn's,
  blows skid off the backs of your hands, and small hurts close while
  you watch. Haplo came out of the Labyrinth and through Death's Gate,
  and down here he had to unwrap in a hurry.
type: armor
slot: hands
level: 8
baseline: cloth
effects:
  - kind: soak
    params: { power: 0.1 }
  - kind: unarmedMult
    params: { mult: 1.2 }
  - kind: regen
    params: { fraction: 0.01 }
