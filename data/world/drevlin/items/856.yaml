name: Limbeck's WUPP pamphlet
keywords: [limbeck, limbecks, wupp, pamphlet]
description: A pamphlet in a cramped, eager hand lies on the table.
look: |
  "WHY? A question for all Gegs. The Welves come down the Liftalofts and
  take our water and call it a blessing. The Kicksey-winsey makes the
  water. We make the Kicksey-winsey go. Who then is the god? Go up the
  Liftalofts and look at what they keep in their ship, and ask them.
  Also: the statue in the Factree hums. What is behind it? Nobody has
  looked. Somebody should. Meeting Thursday. Bring a lamp."
