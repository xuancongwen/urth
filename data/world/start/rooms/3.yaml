name: The Arena Gate
description: |
  The hall ends at an iron gate that stands open. Beyond it the light
  changes: sand, sky, and the sound of something large breathing. A small
  door in the east wall of the hall leads to a shrine, and a colonnade
  runs west toward the colleges.
