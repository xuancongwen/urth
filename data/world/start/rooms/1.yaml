vnum: 1
name: The Armory
description: |
  A square stone room lit by braziers. Racks along the walls hold plain
  weapons and armor, free for anyone starting out. A long hall leads
  north. A trapdoor in the floor stands open on a stair going down, and
  an archway to the south opens on a whitewashed corridor.
exits:
  north: 2
  south: 46
  down: 5
flags: [safe]
