vnum: 9
name: The Hall of Legends
description: |
  Below the Deeper Hall the stair narrows to a crawl and comes out in a
  long, low hall hung with tapestries so old the pictures have slid off
  them. Four doors, and every one of them belongs to a story someone
  once told by a fire. North, a door of weathered pine scored with claw
  marks and hung with a wolf's-head medallion. East, a sheer face of
  grey stone with a tracery of silver lines and an arch, faintly lit.
  South, a wrought-iron gate, and past it a white mist that does not
  move with the draught. West, a pair of enormous timber gates, freshly
  painted, under a sign whose letters you can almost read. A rope
  ladder goes on down into a hum of machinery.
