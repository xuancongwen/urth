vnum: 2
name: The Long Hall
description: |
  A high, plain corridor of dressed stone that ends, to the west, in an
  arch whose bricks have been knocked through; beyond it a warm,
  storybook light. Torches burn in brackets. An old soldier sits on a bench by the
  wall, watching everyone who passes with the same faint amusement.
  Across from him a hooded herald leans on a staff with a ledger under
  one arm, waiting for volunteers. A small door in the east wall leads
  to a shrine, a steep stair climbs to a loft that smells of candle
  smoke, and from the north end of the hall comes a flickering light,
  like a picture show.
