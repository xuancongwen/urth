vnum: 11
name: The Hall of Far Futures
description: |
  The ladder comes down into a round, quiet room of pale grey metal
  that hums very faintly, as though the walls were thinking. There is
  no dust. A ring of soft light runs around the floor, and set into
  the walls are four doors of the same grey. The north door carries a
  small raised emblem of a spaceship and a sun, and above it, in a
  plain and patient script: THE FOUNDATION; somewhere beyond it a
  recorded voice is clearing its throat. The east door is stamped with
  a red corporate logo, SHINRA, and smells faintly of mako. The west
  door is scored by something enormous and mechanical, and a hymn in no
  language you know leaks around its seal. The south door is still
  sealed and blank. The ladder climbs back up to the arcade.
exits:
  up: 2900
  north: 3600
  east: 3700
  west: 3800
flags: [safe]
