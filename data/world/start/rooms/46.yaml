vnum: 46
name: The End of the Corridor
description: |
  The corridor ends at an open archway. Through it to the north is an
  armory, where anything on the racks is free for the taking. Past that
  is a long hall where an old soldier teaches skills for coin
  ('practice') and a herald hands out work ('quest request'). A stair
  under the armory floor goes down, and from there to the rest of the
  world. Near the end, the wall still has things to say:

    'recall' BRINGS YOU BACK TO THE ARMORY FROM ANYWHERE, EXCEPT OUT
    OF A FIGHT. 'recall set' MAKES WHEREVER YOU STAND YOUR RECALL POINT.
    SIMPLE SPELLS ARE TAUGHT FOR COIN: UP THE STAIR FROM THE HALL.
    A GOD TAKES YOU IN FOR WHAT IT WANTS, GIVEN UP ON ITS ALTAR:
    'sacrifice' IT THERE. ASK AT THE SHRINE WHAT THE SUN WANTS.
    'list', 'buy', AND 'sell' TRADE WITH MERCHANTS.

  The last words on the wall are the first ones, painted larger:

    WHEN YOU ARE LOST, TYPE 'help'.
exits:
  north: 1
  south: 45
flags: [safe]
