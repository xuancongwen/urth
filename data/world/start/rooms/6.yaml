vnum: 6
name: The Bell Tower
description: |
  A squat stone tower with a single bronze bell hanging in its open top. The
  rope sways though there is no wind.
  An old woman sits by the door of the tower. "The one who burns on the
  hill kept a token," she says to nobody. "And the well keeps one that
  does not burn."
exits:
  south: 2
  up: 8
