vnum: 42
name: Before a Pine Door
description: |
  The corridor is closed off here by a door of plain pine on iron
  hinges. A shut door hides the way beyond it: 'exits' will not show
  it, and nobody walks through until it is opened. The wall says:

    'open door' OR 'open north' OPENS IT. 'close door' SHUTS IT.
    'look north' TELLS YOU WHAT LIES THAT WAY.
exits:
  north: 43
  south: 41
doors:
  north: {name: the pine door, closed: true}
flags: [safe]
