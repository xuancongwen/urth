vnum: 2303
name: R2-D2
keywords: [astromech, droid, r2, r2-d2, artoo]
description: R2-D2, a squat blue and white astromech droid, whistles and rocks on its treads.
look: |
  A domed barrel of a droid, blue and white, with a single red eye and a
  great many arms hidden behind little panels. It has been plugged into
  the station's computer through a socket it should not have access to,
  and it whistles a long string of notes that is almost certainly rude.
  Somewhere in its memory is a message from a princess, and the plans
  of this station, and it is not telling anyone. It will, however, cut
  you an Imperial access card from the computer for a little silver.
  Type 'list'.
level: 20
flags: [peaceful]
attack:
  verb: zap
trades:
  - { item: 2326, silver: 50 }
effects:
