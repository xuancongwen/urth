name: the Emperor
keywords: [emperor, palpatine, sidious, darth, sith, master]
description: The Emperor sits in his throne with his back to the stars, smiling. "Now witness the firepower of this fully armed and operational battle station."
look: |
  A bent old man in a hooded black robe, his face a ruin of yellowed
  and melted flesh, his eyes the colour of sulphur under the hood. He
  leans on a gnarled black cane he does not need. He has planned for
  your coming, as he has planned for everything, and he is delighted
  you are here. When he lifts his hands, blue lightning crawls between
  his fingers and the room smells of ozone. "Everything that has
  transpired has done so according to my design."
