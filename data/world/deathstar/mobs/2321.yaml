description: Darth Vader stands here, breathing, a red lightsaber in his black-gloved hand.
look: |
  A giant in black: black armour, black cloak, a black helmet flared
  like a samurai's and a mask with a triangular grille through which
  comes, slow and mechanical, the breathing. A box of lights on his
  chest blinks red and green. He tilts his head and considers you, and
  something closes very gently around your throat. He finds your lack of
  faith disturbing.
