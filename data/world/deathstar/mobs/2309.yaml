description: TK-421 stands here, not at his post.
look: |
  A stormtrooper whose armour is identical to every other's, except that
  he is wandering about where he should not be, and his rifle is held
  like he knows what to do with it. Somewhere a supervisor keeps calling
  to ask why he is not at his post. He is the one trooper on this
  station who can hit what he aims at, and he is quietly very proud of
  it.
