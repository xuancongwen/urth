name: a Sith holocron
keywords: [sith, holocron, pyramid, crimson]
description: A small black pyramid of glass, lit from within by red light, lies here.
look: |
  A pyramid of black crystal the size of a fist, lit from inside by a
  slow red pulse like a heartbeat. The Emperor keeps it by his throne;
  the teachings of Sith dead for a thousand years are locked in it, and
  some of them are awake. Power meant to hurt comes stronger through it,
  and sometimes it comes as lightning.
