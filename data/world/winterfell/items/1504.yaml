vnum: 1504
name: a dragonglass dagger
keywords: [dragonglass, dagger, obsidian]
description: A dagger with a blade of black glass lies here.
look: |
  Two shards of dragonglass knapped together into a single leaf-shaped
  blade and set in a grip of weirwood bound with gut. It is lighter than
  steel and colder, and it seems to drink the light around it. The old
  stories call dragonglass frozen fire, and they are right: what it cuts
  goes on burning, black and smokeless, long after the blade is out.
