vnum: 1531
name: a White Walker's shifting mail
keywords: [white, walker, walkers, shifting, mail, armor, armour]
description: A coat of something like armor lies here, taking on the colors of the snow around it.
look: |
  Plates as thin as frost on a window, overlapping like scales, so pale
  they take on the color of whatever is near them: snow, stone, the
  grey of the sky. It is not so much worn as haunted. Blows slide off
  it and find you in the wrong place, and anything that strikes it
  bare-handed leaves some of its warmth behind for good.
