name: Needle
keywords: [needle, small, sword, smallsword, blade]
description: A skinny little sword lies here.
look: |
  A slender blade no longer than a man's arm, made by Mikken at a
  bastard brother's asking for a sister who would never sit still for
  her needlework. It is too thin to hack with and was never meant to.
  It is for quickness and the dance: stick them with the pointy end.
  It rewards a quick hand, keeps its bearer light on their feet, and
  finds the one place that matters.
