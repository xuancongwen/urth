vnum: 1516
name: a pale crystal sword
keywords: [pale, crystal, sword, ice]
description: A sword of translucent pale crystal lies here, smoking with cold.
look: |
  A blade so thin it vanishes when seen edge-on, of something like ice
  that does not melt, shimmering blue and white. It is painful to hold
  bare-handed, and it hums faintly, like a finger run round the rim of
  a glass. Where it touches living flesh the cold goes in and stays,
  and the limbs of the wounded grow heavy and slow.
