description: Mikken the smith works a glowing bar on the anvil, sleeves rolled to the shoulder.
look: |
  A thick-armed man with a burn-scarred leather apron and a beard singed
  short at the edges. He talks while he hammers and does not stop either
  for long. Coin buys steel from him; pelts and dragonglass buy the good
  work, because he cannot get them himself.
