name: the Stone King
keywords: [stone, king, winter, dead, shade]
description: The Stone King sits upright on the empty throne, as he has sat for a thousand years, and turns his head toward you.
look: |
  Not a statue, though you took him for one: a king of the First Men,
  dried to leather and bone, a bronze crown on his brow and a black iron
  sword across his knees. The sword that was meant to keep him in his
  tomb has become his. Frost grows from his fingers. He has been
  waiting for the cold to come again, and it has.
