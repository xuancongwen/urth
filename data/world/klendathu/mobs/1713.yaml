vnum: 1713
name: the tanker bug
keywords: [tanker, bug, arachnid, beetle]
description: The tanker bug grinds forward like a living siege engine, fire dripping from its jaws.
look: |
  A beetle the size of a tank, which is where it gets the name, with a
  domed shell plated like a bunker roof and a head built for ramming.
  From a pair of nozzles under its jaws it sprays a stream of liquid
  fire that sticks and keeps burning. Morita rounds bounce off it with
  a sound like rain on a tin roof. Somewhere in its gut is the last
  trooper who tried.
level: 32
