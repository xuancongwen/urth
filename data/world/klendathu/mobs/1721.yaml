description: Private Ace Levy sits on an ammunition crate by the drill ground, tuning a battered fiddle.
look: |
  A lanky, cocky trooper with a long face and a quick grin, who wanted
  to be squad leader and found out what it costs. Off duty he plays the
  fiddle, and plays it well, for dances in the barracks and for wakes,
