name: Lt. Rasczak's sidearm
keywords: [lt., lt, rasczak's, rasczak, sidearm, pistol, gun]
description: A heavy service pistol with a worn grip lies here.
look: |
  A big Mobile Infantry service pistol, plain and well kept, its grip
  worn pale by one particular hand. Lieutenant Rasczak carried it in
  three wars and a classroom. It shoots straight, it finishes what it
  starts, and the man holding it finds that people do what he says,
  and that he can go on fighting when he ought to be down.
