vnum: 1722
name: the Mobile Infantry helmet
keywords: [mobile, infantry, mi, helmet, helm]
description: A grey trooper's helmet with a cracked camera on the brow lies here.
look: |
  A Mobile Infantry helmet, grey ceramic with a chin cup and a combat
  camera mounted over the brow, its lens cracked. The name stencilled
  across the back has been eaten away by tanker acid. The camera still
  works: it picks out bugs dug into the walls before they move, and
  everything it records is property of the Federal Network. It shrugs
  off fire better than it should.
