vnum: 2807
name: the Cow King
keywords: [cow, king, bovine, bull]
description: The Cow King rises from his throne of cart wheels and bellows. "MOO."
look: |
  A bull the size of a hay wain, upright, in a coat of black-and-white
  hide and a war hat with his own horns through it, a battered crown
  wedged between them. Lightning crackles along his horns and drips off
  his hooves into the grass. He was a demon once, the story goes, or an
  ordinary bull that wandered somewhere it should not have; either way
  he has ruled these fields since before anyone in Tristram believed in
  them, and he does not take kindly to visitors.
