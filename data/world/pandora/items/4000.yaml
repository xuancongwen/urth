name: T.K.'s Wave
keywords: [tk, tk's, t.k.'s, wave, shotgun]
description: A long-barrelled shotgun with a surfboard painted on the stock lies here.
look: |
  A double-barrelled shotgun hand-built from a pipe, a plank, and a lot
  of love by T.K. Baha's late wife, with a little blue wave painted on
  the stock and their initials carved under it. Its pellets come out
  in a slow rolling arc and skip off whatever they hit like stones on
  water, and sometimes hit it again on the way back. Nine-Toes stole
  it. T.K. would like it back, but he would like it more if it were
  being used on skags.
