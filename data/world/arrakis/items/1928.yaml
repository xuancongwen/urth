name: the Atreides shield belt
keywords: [atreides, shield, belt, holtzman, training]
description: A worn belt with a small Holtzman generator at the buckle, stamped with a hawk, lies here.
look: |
  The Holtzman shield belt Paul wore on Caladan, on the practice floor
  with Gurney Halleck and Duncan Idaho, the generator worn bright with
  handling and the hawk stamped on the buckle. Switched on, it wraps
  you in a faint shimmer that stops the fast blow and lets the slow
  one through. Wearing it, you remember the lesson: the slow blade
  penetrates the shield.
