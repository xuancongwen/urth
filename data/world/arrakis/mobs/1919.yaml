look: |
  The na-Baron, nephew and heir of the Baron Harkonnen: young, beautiful,
  and dead in the eyes, with a dancer's body and a gladiator's scars.
  He has fought a hundred slaves in the arena on Giedi Prime and killed
  every one, and he keeps a white knife in his left hand while the
  crowd watches the right. He bows to you, and the bow is a joke at
  your expense.
