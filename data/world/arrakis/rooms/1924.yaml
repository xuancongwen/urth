vnum: 1924
name: The Arena of Feyd-Rautha
description: |
  A small fighting ring of white sand under a gallery, built so that the
  na-Baron can practise on slaves when he is far from Giedi Prime. There
  are dark patches in the sand that have been raked over and have not
  gone away. The gallery is empty. The only way out is west, to the hall,
  and the na-Baron is in no hurry to let you take it.
exits:
  west: 1921
