vnum: 632
name: Taulmaril the Heartseeker
keywords: [taulmaril, heartseeker, bow, longbow]
description: A slender longbow of dark wood lies here, gleaming.
look: |
  An elven longbow, dark and supple, with a string that shines like
  moonlight on snow. Draw it and an arrow is there, trailing silver
  sparks, and it goes where the heart of the thing is. Up close you
  loose it like a spear-thrust. It waited a long time in the dark for
  a hand steady enough, and Catti-brie's was.
type: weapon
level: 12
baseline: standard
weapon:
  hands: 2
  kind: pierce
  verb: shoot
effects:
