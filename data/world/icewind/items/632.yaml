    params: { chance: 0.10, mult: 2 }
  - kind: critMult
    params: { amount: 0.5 }
  - kind: proc
    params: { chance: 0.2, power: 1.0, verb: "streak of silver arrow" }
  - kind: stat
    params: { stat: dexterity, amount: 2 }
