description: A grey robe, its hem crusted with crystal dust, lies in a heap.
look: |
  The robe of an apprentice of the Hosttower of the Arcane in Luskan,
  grey wool with silver thread at the cuffs, too big in the shoulders.
  Akar Kessell wore it the night his master left him to die on the
  tundra, and every night afterward in his tower of crystal. Grains of
  the tower are still caught in the weave, and they whisper, faintly,
  of how clever you are.
