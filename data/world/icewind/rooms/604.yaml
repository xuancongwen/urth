vnum: 604
name: The Tundra Road
description: |
  A road only because the snow is trodden. It runs north from the gate
  into a flatness with nothing to stop the wind for a hundred miles.
  West, a lake glimmers grey. East, the ground rises toward the foot of
  Kelvin's Cairn. North, the snowfields go on.
