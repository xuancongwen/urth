# Urth server configuration. Every field is optional; omitted fields use the
# defaults in internal/config/config.go.

server:
  name: Urth
  # Line-oriented TCP listener. Any MUD client (Mudlet, TinTin++, telnet) can connect.
  telnet_addr: 127.0.0.1:4000
  # WebSocket listener and bare browser client. Leave empty to disable.
  # Open http://<addr>/ in a browser.
  websocket_addr: 127.0.0.1:4001
  # Builder page: area maps, content problems, auto-reload on save. No
  # login, so keep it on loopback and leave it empty in production.
  builder_addr: 127.0.0.1:4002
  # Admin page: characters, connections, and account actions. From this
  # machine it needs no login; from the LAN, sign in with an admin
  # character's name and password. Plain HTTP, so keep it off the open
  # internet. Use 127.0.0.1:4003 for this machine only; empty disables it.
  admin_addr: 0.0.0.0:4003
  # Flood protection, applied to each listener separately. 0 disables one.
  limits:
    # Live connections on the listener, and from one address. Behind
    # cloudflared the web listener keys addresses by CF-Connecting-IP.
    max_connections: 256
    max_per_ip: 8
    # Input lines per connection: a sustained rate, a burst allowance, and
    # how many lines over the rate get a client disconnected.
    input_lines_per_second: 10
    input_burst: 20
    input_flood_limit: 200
  # Optional page view tracker for the web client, such as a self-hosted
  # Umami or Plausible. Empty script_url loads none; attributes are the
  # data-* attributes its script tag needs.
  analytics:
    script_url: ""
    # attributes:
    #   data-website-id: your-umami-website-id

timing:
  # World loop period. Input is processed once per tick.
  tick_ms: 100
  # Length of a combat/regen round in milliseconds. Fractional seconds are
  # fine (1500 is a second and a half); must be at least tick_ms.
  round_ms: 2000
  # How often every online player is saved to disk.
  autosave_seconds: 300

paths:
  # Root directory for world, player, and script files.
  data: data

world:
  # Vnum of the room new characters start in: the tutorial corridor.
  start_room: 40
  # Where a player who dies comes back; 0 means start_room.
  respawn_room: 1
  # The first character ever created becomes an admin (copyover, shutdown).
  first_player_is_admin: true

log:
  # debug, info, warn, error
  level: info
  # text or json
  format: text
